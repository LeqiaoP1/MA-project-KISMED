metadata:
  output: "presentation/output/research_midterm_clean.pptx"
  title: "Multimodal Representation Learning with Masked Autoencoders"
  presentation_type: "Zwischenvortrag Masterarbeit"
  author: "Leqiao Peng"
  supervisor: "Tizian Dege"
  date: "Oktober 2026"

slides:
  # Slide 1: Preserved Title Slide
  - type: "title"

  # Motivation
  - type: "split"
    title: "Motivation & Research Problem"
    section: "I. Motivation"
    bullets:
      - "**Clinical motivation:** Physiological waveforms are usually measured with contact sensors."
      - "**Research problem:** RGB and TIR videos contain weak, heterogeneous physiological signals."
      - "**Research question:** Can multimodal masked pre-training improve reconstruction for unseen subjects?"
    image:
      path: "experiments/figures/motivation_diagram.png"
      label: "RGB/TIR video -> representation -> BP/RESP waveform"

  # Data and physiological targets
  - type: "split"
    title: "Data & Physiological Targets"
    section: "I. Motivation"
    bullets:
      - "**Current input:** False-colour thermal infrared video cropped to a facial TIR-ROI."
      - "**Representation caveat:** The render is an 8-bit palette (~0.04 degC per level, lossy WMV3), not radiometric temperature."
      - "**Current target:** Continuous respiration waveform from the contact sensor."
      - "**Evaluation setting:** Contactless reconstruction for strictly unseen subjects; RGB/BP remain comparison paths."
    image:
      path: "experiments/figures/data_targets_overview.png"
      label: "TIR-ROI video and respiration reference signal"

  # Method
  - type: "split"
    title: "Architecture: Multi-Task Masked Autoencoder"
    section: "II. Method"
    bullets:
      - "**Stage 1:** Initialize the visual encoder with VideoMAE."
      - "**Stage 2:** Masked multi-modal pre-training: visual masking 90 %, physiological stream 50 %, with span masking for the 1-D signal."
      - "**Stage 3:** Reconstruct the respiration waveform from the TIR-ROI alone, simulating total contact-sensor failure."
    image:
      path: "experiments/figures/architecture_overview.png"
      label: "Three stages: initialization -> pre-training -> fine-tuning"

  # Current experimental focus
  - type: "split"
    title: "Current Experimental Focus"
    section: "II. Method"
    bullets:
      - "**Primary path:** Thermal infrared region of interest (TIR-ROI) -> respiration waveform."
      - "**HPC full run:** Stage-2 pre-training and Stage-3 fine-tuning completed on the full corpus (~1,400 sessions discovered; ~97 % usable)."
      - "**Matched setup:** 8-second clips, 112 x 112 ROI input, 100 Hz target, and subject-disjoint splitting."
      - "**Infrastructure:** An offline 112 x 112 ROI cache (1,385 shards, 91 GB) removes the decode bottleneck, so full-corpus training is compute-bound (loader share 84.5 % -> 0.0 %)."
    image:
      path: "experiments/figures/tir_roi_resp_pipeline.png"
      label: "Completed HPC pipeline: TIR-ROI video -> respiration waveform"

  # Current status
  - type: "full_image"
    title: "First Full HPC Run Completed: TIR-ROI -> Respiration"
    section: "III. Results"
    image:
      path: "experiments/figures/pipeline_status.png"
      label: "Completed HPC run and preliminary subject-level evaluation"
      left_in: 1.0
      top_in: 1.6
      width_in: 11.33
      height_in: 5.0

  # Preliminary results
  - type: "table"
    title: "Preliminary HPC Results"
    section: "III. Results"
    table_data:
      headers: ["Measure", "Result", "Interpretation"]
      rows:
        - ["Evaluation volume", "28 subjects / 273 sessions / 5,143 clips", "Held-out subject split"]
        - ["Band-limited Pearson", "0.569", "Median per subject; 95% CI [0.451, 0.624]"]
        - ["Single-tone baseline", "0.535", "Rate-only reference; 95% CI [0.499, 0.545]"]
        - ["Subjects beating baseline", "53.6%", "Essentially at chance (50%)"]
        - ["Respiration-rate MAE", "4.66 BPM", "30 s windows; 46% within 10%"]
        - ["Task-group ordering", "+0.738 / +0.524 / +0.515", "Low / moderate / high distortion; expected order"]

  # Result interpretation
  - type: "text_only"
    title: "How to Interpret the First Run"
    section: "III. Results"
    bullets:
      - "**Marginal edge:** The median band-limited Pearson (0.569) edges the single-tone template (0.535), but the model CI [0.451, 0.624] overlaps the baseline CI [0.499, 0.545]."
      - "**At chance level:** Only 53.6 % of held-out subjects beat the rate-only baseline - essentially a coin flip."
      - "**Practical reading:** The model recovers a breathing-rate-related pattern for part of the cohort, but does not establish reliable facial respiration reconstruction."
      - "**Status:** An initial full-run result for debugging and scientific diagnosis, not a final generalisation claim."

  # Why the negative happens
  - type: "text_only"
    title: "Why the Thermal Face ROI Does Not Carry Respiration"
    section: "III. Results"
    bullets:
      - "**Off-face winners:** The strongest respiration-correlated pixel in the frame sits on the chest, the hair, or a fixed background/rig band - never on the face."
      - "**Wrong reference on the face:** On the face the strongest correlation is with head motion, not with the respiration belt."
      - "**Not the difficulty label:** Detection is near-uniform across tasks and non-monotonic across distortion groups, so the task label is not the lever."
      - "**Representation-limited input:** 8-bit palettised false colour, face near the saturated end, frontal view - the exhaled-air plume has almost no thermal contrast against equally warm skin."
      - "**Verdict:** A controlled negative for facial thermal respiration at this geometry; the limiting factor is the input, not the architecture."

  # Scientific limitation
  - type: "comparison"
    title: "Critical Limitation: Whole-Frame Correlations Are Not Facial Evidence"
    section: "III. Results"
    images:
      - path: "code/analysis/tir_resp/frame_argmax_F001_T3.png"
        label: "F001_T3: strongest |r| is off-face at the chest/shoulder (max over pixels x lags vs a scrambled null)"
      - path: "code/analysis/tir_resp/frame_argmax_F002_T1.png"
        label: "F002_T1: strongest |r| lies outside the facial ROI"

  - type: "text_only"
    title: "Scientific Qualification of the Result"
    section: "III. Results"
    bullets:
      - "**Implication:** A respiration-correlated prediction can reflect motion or the recording setup rather than a robust facial thermal signal."
      - "**Evaluation caveat:** The reported checkpoint was selected using validation Pearson on the same subject-disjoint split used for the reported evaluation."
      - "**Amplitude caveat:** The prediction is session-z-scored against a raw-volts reference, so only scale-invariant metrics are valid; amplitude errors need an oracle calibration."
      - "**Claim boundary:** Present the run as a useful baseline, ablation and failure analysis; do not claim clinical validity or reliable whole-cohort reconstruction."

  # Why the negative is credible
  - type: "text_only"
    title: "Why the Negative Is a Measurement, Not a Failure to Measure"
    section: "III. Results"
    bullets:
      - "**Positive control (thermal):** The same statistic detects head motion in 8/8 sessions at p<0.005 (|r| up to 0.98), while respiration is not detected in any session."
      - "**Palette is not the limit:** In-band thermal modulation spans 2.9-36.2 palette levels (far above 1 level), so the render does carry variation."
      - "**Resolution is not the limit:** Native-resolution and 64 x 64 probes reach the same verdict; downsampling is harmless for a spatially coherent signal."
      - "**Positive control (RGB):** On the same corpus facial RGB carries a genuine skin-borne cardiac signal (CHROM/POS detected in 35/40 sessions, background control at chance)."
      - "**Scope:** Controls were run on a 4-subject / 8-session subset; the corpus-scale verdict is the subject-level report."

  # Ruled out
  - type: "text_only"
    title: "Ruled Out: Negative Ablations (Local 4-Subject Probes)"
    section: "III. Results"
    bullets:
      - "**Resolution:** 64 x 64 vs native ROI changes the gate verdict by at most 0.04 - not the bottleneck."
      - "**Colour encoding:** Inverting the palette to ordinal temperature buys ~0.01 of peak sharpness; RGB, grey and LUT agree."
      - "**ROI variant:** Nostril-only boxes are unstable (height set by landmark jitter); nose-tip is the usable small ROI."
      - "**Loss weighting:** gamma arms (0 / 0.01 / 10) all score worse than a constant predictor on the held-out subject."
      - "**Masking design:** Scattered masking is solved by linear interpolation without any video; span masking removes that shortcut by construction."

  # Evaluation protocol
  - type: "split"
    title: "Evaluation: Preliminary Single-Split Test"
    section: "III. Results"
    bullets:
      - "**Split:** Training, validation and test subjects are strictly disjoint (split_by subject)."
      - "**Unit of evaluation:** A subject; all clips of a session are assembled into one continuous waveform (Hann overlap-add)."
      - "**Headline metric:** Band-limited Pearson (0.1-0.6 Hz), median per subject, against a single-tone template and a constant line."
      - "**Known gap:** Checkpoint selection and reporting use the same validation split (selection leakage)."
      - "**Next eval step:** Separate selection from reporting (--test_subjects) and run the leave-one-subject-out sweep; k-fold is the follow-up."
    image:
      path: "experiments/figures/evaluation_protocol.png"
      label: "Single subject-disjoint test split and baseline comparison"

  # Roadmap
  - type: "full_image"
    title: "Roadmap & Milestones"
    section: "IV. Outlook"
    image:
      path: "experiments/figures/timeline_gantt.png"
      label: "Completed -> ongoing -> planned"
      left_in: 1.0
      top_in: 1.6
      width_in: 11.33
      height_in: 5.0

  # Conclusion
  - type: "text_only"
    title: "Interim Conclusions & Next Steps"
    section: "IV. Outlook"
    bullets:
      - "**Achieved:** The first complete full-corpus HPC run for TIR-ROI -> respiration (Stage 2 + Stage 3)."
      - "**Finding:** The median rhythm score edges the single-tone baseline only marginally (0.569 vs. 0.535) and half the cohort does not beat it."
      - "**Mechanism:** Whole-frame wins are off-face (chest / hair / rig); on the face the dominant reference is head motion, not the belt."
      - "**Ongoing A/B:** Point-wise SmoothL1 instead of the amplitude-only StdLoss (same encoder, geometry and schedule) - tests whether the near-single-tone collapse is a loss artefact or an input limit."
      - "**Infrastructure:** The offline TIR-ROI cache makes the full-corpus run compute-bound rather than decode-bound."
      - "**Next step:** Separate checkpoint selection from reporting and run the LOSO sweep; k-fold cross-validation is the follow-up."

  # Appendix: References
  - type: "text_only"
    title: "References"
    section: "APPENDIX"
    bullets:
      - "[1] K. He, X. Chen, S. Xie, Y. Li, P. Dollár, and R. Girshick, 'Masked Autoencoders Are Scalable Vision Learners,' CVPR, 2022."
      - "[2] R. Bachmann, D. Mizrahi, A. Atanov, and A. Zamir, 'MultiMAE: Multi-modal Multi-task Masked Autoencoders,' ECCV, 2022."
      - "[3] Z. Zhang et al., 'Multimodal Spontaneous Emotion Corpus (BP4D+),' IEEE FG, 2016."

