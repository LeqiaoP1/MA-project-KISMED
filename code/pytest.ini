# Pytest configuration for the code/ tree.
# Run from code/:  python -m pytest
#
# The suite lives in tests/ (see AGENTS.md section 4). `tests/conftest.py` puts
# code/ on sys.path so the runtime packages (runners, data, core, engines,
# utils, models) are importable during collection.
[pytest]
testpaths = tests
python_files = test_*.py
