  </g>

  <!-- axes -->
  <g class="axis">
    <line x1="96"  y1="462" x2="326" y2="462"/>
    <line x1="402" y1="462" x2="632" y2="462"/>
    <line x1="708" y1="462" x2="938" y2="462"/>
  </g>
  <g class="tick">
    <line x1="96"  y1="462" x2="96"  y2="467"/>
    <line x1="173" y1="462" x2="173" y2="467"/>
    <line x1="249" y1="462" x2="249" y2="467"/>
