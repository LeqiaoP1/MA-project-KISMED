<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520"
     role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">Respiration Stage-3, 5-fold CV: per-task and per-group medians</title>
  <desc id="figDesc">Three horizontal bar panels showing band-limited Pearson (0.1-0.6 Hz), oracle
  amplitude relative error and rate MAE (BPM) for the ten BP4D+ tasks T1 to T10 and the three
  score groups low, high and moderate. Rows follow the ordering in resp_5fold_cv.md, i.e. tasks
  sorted by descending band-limited Pearson.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
    .sub   { font-size: 12px; fill: #5a5a5a; }
    .hdr   { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .lab   { font-size: 13px; fill: #333333; text-anchor: end; }
    .labB  { font-size: 13px; font-weight: 700; fill: #1a1a1a; text-anchor: end; }
    .val   { font-size: 11px; fill: #4a4a4a; font-variant-numeric: tabular-nums; }
    .valB  { font-size: 11px; font-weight: 700; fill: #1a1a1a; font-variant-numeric: tabular-nums; }
    .task  { fill: #3b6ea5; }
    .group { fill: #e07b39; }
    .band  { fill: #f5f8fc; }
    .gband { fill: #fdf3e7; }
    .grid  { stroke: #e2e2e2; stroke-width: 1; }
    .axis  { stroke: #9a9a9a; stroke-width: 1; }
    .tick  { stroke: #9a9a9a; stroke-width: 1; }
    .tlab  { font-size: 10px; fill: #777777; text-anchor: middle; }
    .sep   { stroke: #cfc6b8; stroke-width: 1; stroke-dasharray: 4 3; }
    .foot  { font-size: 11px; fill: #6a6a6a; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="520"/>

  <!-- header -->
  <text class="title" x="92" y="28">Respiration Stage-3 &#183; 5-fold CV: per-task and per-group medians</text>
  <text class="sub"   x="92" y="48">138 subjects &#183; 1260 sessions &#183; 21 231 clips &#183; median over sessions, then median over subjects</text>

  <rect class="task" x="742" y="36" width="12" height="12" rx="2"/>
  <text class="sub" x="760" y="47">per task (T1&#8211;T10)</text>
  <rect class="group" x="872" y="36" width="12" height="12" rx="2"/>
  <text class="sub" x="890" y="47">score group</text>

  <!-- panel headers: arrow = direction of better -->
  <text class="hdr" x="96"  y="66">band-limited Pearson (0.1&#8211;0.6 Hz) &#8593;</text>
  <text class="hdr" x="402" y="66">amplitude rel. error (oracle) &#8595;</text>
  <text class="hdr" x="708" y="66">rate MAE (BPM) &#8595;</text>

  <!-- row backgrounds -->
  <rect class="band"  x="84" y="112" width="906" height="26"/>
  <rect class="band"  x="84" y="168" width="906" height="26"/>
  <rect class="band"  x="84" y="224" width="906" height="26"/>
  <rect class="band"  x="84" y="280" width="906" height="26"/>
  <rect class="band"  x="84" y="336" width="906" height="26"/>
  <rect class="gband" x="84" y="373" width="906" height="86" rx="3"/>

  <!-- vertical grid lines -->
  <g class="grid">
    <line x1="173" y1="80" x2="173" y2="462"/>
    <line x1="249" y1="80" x2="249" y2="462"/>
    <line x1="326" y1="80" x2="326" y2="462"/>
    <line x1="517" y1="80" x2="517" y2="462"/>
    <line x1="632" y1="80" x2="632" y2="462"/>
    <line x1="785" y1="80" x2="785" y2="462"/>
    <line x1="861" y1="80" x2="861" y2="462"/>
    <line x1="938" y1="80" x2="938" y2="462"/>
  </g>

  <!-- row labels -->
  <g class="lab">
    <text x="80" y="102">T1</text>
    <text x="80" y="130">T2</text>
    <text class="labB" x="80" y="158">T3</text>
    <text x="80" y="186">T4</text>
    <text x="80" y="214">T5</text>
    <text x="80" y="242">T6</text>
    <text x="80" y="270">T7</text>
    <text x="80" y="298">T8</text>
    <text x="80" y="326">T9</text>
    <text class="labB" x="80" y="354">T10</text>
    <text x="80" y="392">low</text>
    <text x="80" y="420">high</text>
    <text x="80" y="448">moderate</text>
  </g>

  <line class="sep" x1="84" y1="367" x2="990" y2="367"/>

