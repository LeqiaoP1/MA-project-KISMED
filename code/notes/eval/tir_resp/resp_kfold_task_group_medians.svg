    <rect x="402" y="436" width="200" height="16" rx="2"/>
  </g>
  <g class="val">
    <text x="640" y="102">0.644</text>
    <text x="640" y="130">0.667</text>
    <text class="valB" x="640" y="158">0.469</text>
    <text x="640" y="186">0.745</text>
    <text x="640" y="214">0.622</text>
