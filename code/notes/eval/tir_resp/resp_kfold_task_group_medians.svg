    <rect x="96" y="286" width="140" height="16" rx="2"/>
    <rect x="96" y="314" width="123" height="16" rx="2"/>
    <rect x="96" y="342" width="78"  height="16" rx="2"/>
  </g>
  <g class="group">
    <rect x="96" y="380" width="171" height="16" rx="2"/>
    <rect x="96" y="408" width="124" height="16" rx="2"/>
    <rect x="96" y="436" width="104" height="16" rx="2"/>
  </g>
  <g class="val">
    <text x="334" y="102">+0.289</text>
    <text x="334" y="130">+0.336</text>
    <text class="valB" x="334" y="158">+0.567</text>
    <text x="334" y="186">+0.254</text>
    <text x="334" y="214">+0.377</text>
    <text x="334" y="242">+0.305</text>
    <text x="334" y="270">+0.255</text>
    <text x="334" y="298">+0.365</text>
    <text x="334" y="326">+0.320</text>
    <text class="valB" x="334" y="354">+0.203</text>
    <text x="334" y="392">+0.447</text>
    <text x="334" y="420">+0.323</text>
    <text x="334" y="448">+0.272</text>
  </g>

