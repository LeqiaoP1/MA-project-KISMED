    <text x="640" y="270">0.755</text>
    <text x="640" y="298">0.604</text>
    <text x="640" y="326">0.700</text>
    <text class="valB" x="640" y="354">0.699</text>
    <text x="640" y="392">0.577</text>
    <text x="640" y="420">0.668</text>
    <text x="640" y="448">0.694</text>
  </g>

  <!-- panel 3: rate MAE, scale 0 .. 6 BPM, plot 708 .. 938 -->
  <g class="task">
    <rect x="708" y="90"  width="190" height="16" rx="2"/>
    <rect x="708" y="118" width="165" height="16" rx="2"/>
    <rect x="708" y="146" width="41"  height="16" rx="2"/>
    <rect x="708" y="174" width="192" height="16" rx="2"/>
    <rect x="708" y="202" width="155" height="16" rx="2"/>
