<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" width="1000" height="514"
     role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">Respiration Stage-3, 5-fold CV: per-task and per-group medians</title>
  <desc id="figDesc">Three horizontal bar panels showing band-limited Pearson (0.1-0.6 Hz), oracle amplitude relative error and rate MAE (BPM) for the ten BP4D+ tasks T1 to T10 and the three score groups. Task rows are in T1-T10 order and the low tier&#39;s tasks are drawn in bold; the group rows are a re-aggregation of the same sessions under the shipped task-tier definition.</desc>
