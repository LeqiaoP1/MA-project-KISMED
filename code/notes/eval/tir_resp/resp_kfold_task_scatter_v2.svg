    <line x1="90" y1="152" x2="660" y2="152"/>
    <line x1="90" y1="100" x2="660" y2="100"/>
  </g>
  <g class="axis">
    <line x1="90" y1="520" x2="660" y2="520"/>
    <line x1="90" y1="100" x2="90" y2="520"/>
  </g>
  <g class="tick">
    <line x1="153" y1="520" x2="153" y2="526"/>
    <line x1="280" y1="520" x2="280" y2="526"/>
    <line x1="407" y1="520" x2="407" y2="526"/>
    <line x1="533" y1="520" x2="533" y2="526"/>
    <line x1="660" y1="520" x2="660" y2="526"/>
