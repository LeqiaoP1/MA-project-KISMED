    <rect x="686" y="420.0" width="16" height="10.2" fill="#849b9e"/>
    <rect x="686" y="410.0" width="16" height="10.2" fill="#8ea19d"/>
    <rect x="686" y="400.0" width="16" height="10.2" fill="#99a69b"/>
    <rect x="686" y="390.0" width="16" height="10.2" fill="#a3ac9a"/>
    <rect x="686" y="380.0" width="16" height="10.2" fill="#aeb199"/>
    <rect x="686" y="370.0" width="16" height="10.2" fill="#b8b797"/>
    <rect x="686" y="360.0" width="16" height="10.2" fill="#c3bc96"/>
    <rect x="686" y="350.0" width="16" height="10.2" fill="#cdc294"/>
