<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" width="800" height="584"
     role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">Respiration Stage-3, 5-fold CV: per-task scatter of rhythm quality</title>
  <desc id="figDesc">Scatter plot of the ten BP4D+ tasks, one dot each. The x axis is band-limited Pearson correlation (0.1-0.6 Hz, higher is better), the y axis is rate MAE in breaths per minute (lower is better). Dot colour encodes the oracle-calibrated amplitude relative error, blue for small error through red for large error.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
    .sub   { font-size: 12px; fill: #5a5a5a; }
    .grid  { stroke: #e8e8e8; stroke-width: 1; }
    .axis  { stroke: #8a8a8a; stroke-width: 1.2; }
    .tick  { stroke: #8a8a8a; stroke-width: 1; }
    .tlab  { font-size: 11px; fill: #666666; text-anchor: end; }
    .tlabx { font-size: 11px; fill: #666666; text-anchor: middle; }
    .axt   { font-size: 11px; font-weight: 700; fill: #333333; }
    .dot   { stroke: #3a3a3a; stroke-width: 0.8; }
    .dlab  { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .hint  { font-size: 11px; font-style: italic; fill: #9a9a9a; }
    .cbt   { font-size: 10px; fill: #666666; }
    .cbtitle { font-size: 10px; fill: #666666; }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="584"/>
  <text class="title" x="90" y="34">Respiration Stage-3 &#183; 5-fold CV: per-task scatter (T1&#8211;T10)</text>
  <text class="sub" x="90" y="54">138 subjects &#183; 1260 sessions &#183; 21 231 clips &#183; per-subject medians, three metric families on one plane</text>
  <text class="axt" x="90" y="88">rate MAE (BPM), lower is better</text>
  <text class="cbtitle" x="686" y="88">amp rel. err (oracle)</text>
  <g class="grid">
    <line x1="153" y1="100" x2="153" y2="520"/>
    <line x1="280" y1="100" x2="280" y2="520"/>
    <line x1="407" y1="100" x2="407" y2="520"/>
    <line x1="533" y1="100" x2="533" y2="520"/>
    <line x1="660" y1="100" x2="660" y2="520"/>
    <line x1="90" y1="520" x2="660" y2="520"/>
    <line x1="90" y1="450" x2="660" y2="450"/>
    <line x1="90" y1="380" x2="660" y2="380"/>
    <line x1="90" y1="310" x2="660" y2="310"/>
    <line x1="90" y1="240" x2="660" y2="240"/>
    <line x1="90" y1="170" x2="660" y2="170"/>
    <line x1="90" y1="100" x2="660" y2="100"/>
  </g>
  <g class="axis">
    <line x1="90" y1="520" x2="660" y2="520"/>
    <line x1="90" y1="100" x2="90" y2="520"/>
  </g>
  <g class="tick">
    <line x1="153" y1="520" x2="153" y2="526"/>
    <line x1="280" y1="520" x2="280" y2="526"/>
    <line x1="407" y1="520" x2="407" y2="526"/>
    <line x1="533" y1="520" x2="533" y2="526"/>
    <line x1="660" y1="520" x2="660" y2="526"/>
    <line x1="84" y1="520" x2="90" y2="520"/>
    <line x1="84" y1="450" x2="90" y2="450"/>
    <line x1="84" y1="380" x2="90" y2="380"/>
    <line x1="84" y1="310" x2="90" y2="310"/>
    <line x1="84" y1="240" x2="90" y2="240"/>
    <line x1="84" y1="170" x2="90" y2="170"/>
    <line x1="84" y1="100" x2="90" y2="100"/>
  </g>
  <g class="tlab">
    <text x="82" y="524">0</text>
    <text x="82" y="454">1</text>
    <text x="82" y="384">2</text>
    <text x="82" y="314">3</text>
    <text x="82" y="244">4</text>
    <text x="82" y="174">5</text>
    <text x="82" y="104">6</text>
  </g>
  <g class="tlabx">
    <text x="153" y="540">0.2</text>
    <text x="280" y="540">0.3</text>
    <text x="407" y="540">0.4</text>
    <text x="533" y="540">0.5</text>
    <text x="660" y="540">0.6</text>
  </g>
  <text class="axt" x="375" y="562" text-anchor="middle">band-limited Pearson, 0.1&#8211;0.6 Hz (higher is better)</text>
  <text class="hint" x="652" y="508" text-anchor="end">better</text>
  <!-- task dots: x = band-limited Pearson, y = rate MAE, fill = oracle amp rel. err -->
  <circle class="dot" cx="267" cy="173" r="7" fill="#ecb078"/>
  <circle class="dot" cx="325" cy="219" r="7" fill="#e19369"/>
  <circle class="dot" cx="618" cy="445" r="7" fill="#2669ab"/>
  <circle class="dot" cx="222" cy="169" r="7" fill="#b92a34"/>
  <circle class="dot" cx="378" cy="237" r="7" fill="#f7ce87"/>
  <circle class="dot" cx="286" cy="107" r="7" fill="#da8060"/>
  <circle class="dot" cx="223" cy="176" r="7" fill="#b41d2d"/>
  <circle class="dot" cx="362" cy="169" r="7" fill="#efd490"/>
  <circle class="dot" cx="306" cy="117" r="7" fill="#d06652"/>
  <circle class="dot" cx="157" cy="213" r="7" fill="#d06753"/>
  <!-- task labels (greedy de-overlap) -->
  <g class="dlab">
    <text class="dlab" x="278" y="166">T1</text>
    <text class="dlab" x="336" y="212">T2</text>
    <text class="dlab" x="629" y="438">T3</text>
    <text class="dlab" x="233" y="162">T4</text>
    <text class="dlab" x="389" y="230">T5</text>
    <text class="dlab" x="297" y="122">T6</text>
    <text class="dlab" x="234" y="191">T7</text>
    <text class="dlab" x="373" y="162">T8</text>
    <text class="dlab" x="295" y="110" text-anchor="end">T9</text>
    <text class="dlab" x="168" y="206">T10</text>
  </g>
  <!-- colour scale for amplitude rel. error: discrete strips (no gradient support needed) -->
  <g>
    <rect x="686" y="510.0" width="16" height="10.2" fill="#2669ab"/>
    <rect x="686" y="500.0" width="16" height="10.2" fill="#306faa"/>
    <rect x="686" y="490.0" width="16" height="10.2" fill="#3b74a8"/>
