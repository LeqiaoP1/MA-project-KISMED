<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 584" width="800" height="584"
     role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">Respiration Stage-3, 5-fold CV: per-task scatter of rhythm quality</title>
  <desc id="figDesc">Scatter plot of the ten BP4D+ tasks, one dot each. The x axis is band-limited Pearson correlation (0.1-0.6 Hz, higher is better), the y axis is rate MAE in breaths per minute (lower is better). Dot colour encodes the oracle-calibrated amplitude relative error, blue for small error through red for large error; the ring around each dot encodes the task&#39;s distortion tier (solid green = low, dashed cyan = moderate, solid black = high), and the in-plot key lists the tasks of each tier.</desc>
  <style>
    .bg    { fill: #ffffff; }
    .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
    .sub   { font-size: 12px; fill: #5a5a5a; }
    .grid  { stroke: #e8e8e8; stroke-width: 1; }
    .axis  { stroke: #8a8a8a; stroke-width: 1.2; }
    .tick  { stroke: #8a8a8a; stroke-width: 1; }
    .tlab  { font-size: 11px; fill: #666666; text-anchor: end; }
    .tlabx { font-size: 11px; fill: #666666; text-anchor: middle; }
    .axt   { font-size: 11px; font-weight: 700; fill: #333333; }
    .dot   { stroke: #3a3a3a; stroke-width: 0.8; }
    .dlab  { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .hint  { font-size: 11px; font-style: italic; fill: #9a9a9a; }
    .cbt   { font-size: 10px; fill: #666666; }
    .cbtitle { font-size: 10px; fill: #666666; }
    .lgbox { fill: #ffffff; fill-opacity: 0.94; stroke: #dcdcdc; stroke-width: 0.8; }
    .lgh   { font-size: 10px; font-weight: 700; fill: #777777; }
    .lgd   { font-size: 11px; fill: #333333; }
  </style>
  <rect class="bg" x="0" y="0" width="800" height="584"/>
  <text class="title" x="90" y="34">Respiration Stage-3 &#183; 5-fold CV: per-task scatter (T1&#8211;T10)</text>
  <text class="sub" x="90" y="54">138 subjects &#183; 1260 sessions &#183; 21 231 clips &#183; per-subject medians, three metric families on one plane</text>
  <text class="axt" x="90" y="88">rate MAE (BPM), lower is better</text>
  <text class="cbtitle" x="686" y="88">amp rel. err (oracle)</text>
