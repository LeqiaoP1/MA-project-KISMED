    <rect x="686" y="100" width="16" height="420" fill="none" stroke="#9a9a9a" stroke-width="0.6"/>
  </g>
  <line class="tick" x1="680" y1="520" x2="686" y2="520"/>
  <text class="cbt" x="708" y="523">0.47</text>
  <line class="tick" x1="680" y1="310" x2="686" y2="310"/>
  <text class="cbt" x="708" y="313">0.61</text>
  <line class="tick" x1="680" y1="100" x2="686" y2="100"/>
  <text class="cbt" x="708" y="103">0.76</text>
</svg>
