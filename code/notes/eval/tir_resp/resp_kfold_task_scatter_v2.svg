  </g>
  <!-- tier legend: ring colour = low / moderate / high -->
  <rect class="lgbox" x="98" y="404" width="212" height="86" rx="3"/>
  <text class="lgh" x="108" y="420">distortion tier (outer ring)</text>
  <circle cx="114" cy="434" r="6" fill="#ffffff" stroke="#1a8f3c" stroke-width="2.8"/>
  <text class="lgd" x="126" y="438">low = T2, T3, T5</text>
  <circle cx="114" cy="452" r="6" fill="#ffffff" stroke="#00a8c0" stroke-width="2.8" stroke-dasharray="4.2 2.6"/>
