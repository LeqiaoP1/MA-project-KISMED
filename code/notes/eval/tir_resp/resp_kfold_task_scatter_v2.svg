    <rect x="686" y="270.0" width="16" height="10.2" fill="#f0bb7d"/>
    <rect x="686" y="260.0" width="16" height="10.2" fill="#ecb179"/>
    <rect x="686" y="250.0" width="16" height="10.2" fill="#e9a874"/>
    <rect x="686" y="240.0" width="16" height="10.2" fill="#e59f6f"/>
    <rect x="686" y="230.0" width="16" height="10.2" fill="#e2956b"/>
