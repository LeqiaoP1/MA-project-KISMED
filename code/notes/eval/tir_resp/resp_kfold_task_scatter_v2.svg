  <circle class="tier" cx="157" cy="290" r="10.2" fill="none" stroke="#101010" stroke-width="2.6"/>
  <!-- task labels (greedy de-overlap) -->
  <g class="dlab">
    <text class="dlab" x="282" y="253">T1</text>
    <text class="dlab" x="340" y="287">T2</text>
    <text class="dlab" x="633" y="457">T3</text>
