<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620"
     role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">Respiration Stage-3, 5-fold CV: per-task scatter of rhythm quality</title>
  <desc id="figDesc">Scatter plot of the ten BP4D+ tasks, one dot each. The x axis is band-limited
  Pearson correlation (0.1-0.6 Hz, higher is better), the y axis is rate MAE in breaths per
  minute (lower is better). Dot colour encodes the oracle-calibrated amplitude relative error,
  blue for small error through red for large error.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
    .sub   { font-size: 12px; fill: #5a5a5a; }
    .grid  { stroke: #e8e8e8; stroke-width: 1; }
    .axis  { stroke: #8a8a8a; stroke-width: 1.2; }
    .tick  { stroke: #8a8a8a; stroke-width: 1; }
    .tlab  { font-size: 11px; fill: #666666; text-anchor: end; }
    .tlabx { font-size: 11px; fill: #666666; text-anchor: middle; }
    .axt   { font-size: 11px; font-weight: 700; fill: #333333; }
    .dot   { stroke: #3a3a3a; stroke-width: 0.8; }
    .dlab  { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .hint  { font-size: 11px; font-style: italic; fill: #9a9a9a; }
    .cbt   { font-size: 10px; fill: #666666; }
    .cbtitle { font-size: 10px; fill: #666666; }
    .foot  { font-size: 10.5px; fill: #6a6a6a; }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="620"/>

  <!-- header -->
  <text class="title" x="90" y="34">Respiration Stage-3 &#183; 5-fold CV: per-task scatter (T1&#8211;T10)</text>
  <text class="sub"   x="90" y="54">138 subjects &#183; 1260 sessions &#183; 21 231 clips &#183; per-subject medians, three metric families on one plane</text>

  <!-- axis / scale titles (kept horizontal so every renderer shows them) -->
  <text class="axt" x="90" y="88">rate MAE (BPM), lower is better</text>
  <text class="cbtitle" x="686" y="88">amp rel. err (oracle)</text>

  <!-- grid -->
  <g class="grid">
    <line x1="153" y1="100" x2="153" y2="520"/>
    <line x1="280" y1="100" x2="280" y2="520"/>
    <line x1="407" y1="100" x2="407" y2="520"/>
    <line x1="533" y1="100" x2="533" y2="520"/>
    <line x1="90"  y1="450" x2="660" y2="450"/>
    <line x1="90"  y1="380" x2="660" y2="380"/>
    <line x1="90"  y1="310" x2="660" y2="310"/>
    <line x1="90"  y1="240" x2="660" y2="240"/>
    <line x1="90"  y1="170" x2="660" y2="170"/>
  </g>

  <!-- axes -->
  <g class="axis">
    <line x1="90"  y1="520" x2="660" y2="520"/>
    <line x1="90"  y1="100" x2="90"  y2="520"/>
  </g>
  <g class="tick">
    <line x1="153" y1="520" x2="153" y2="526"/>
    <line x1="280" y1="520" x2="280" y2="526"/>
    <line x1="407" y1="520" x2="407" y2="526"/>
    <line x1="533" y1="520" x2="533" y2="526"/>
    <line x1="660" y1="520" x2="660" y2="526"/>
    <line x1="84"  y1="520" x2="90"  y2="520"/>
    <line x1="84"  y1="450" x2="90"  y2="450"/>
    <line x1="84"  y1="380" x2="90"  y2="380"/>
    <line x1="84"  y1="310" x2="90"  y2="310"/>
    <line x1="84"  y1="240" x2="90"  y2="240"/>
    <line x1="84"  y1="170" x2="90"  y2="170"/>
    <line x1="84"  y1="100" x2="90"  y2="100"/>
  </g>
  <g class="tlab">
    <text x="82" y="524">0</text>
    <text x="82" y="454">1</text>
    <text x="82" y="384">2</text>
    <text x="82" y="314">3</text>
    <text x="82" y="244">4</text>
    <text x="82" y="174">5</text>
    <text x="82" y="104">6</text>
  </g>
  <g class="tlabx">
    <text x="153" y="540">0.2</text>
    <text x="280" y="540">0.3</text>
    <text x="407" y="540">0.4</text>
    <text x="533" y="540">0.5</text>
    <text x="660" y="540">0.6</text>
  </g>
  <text class="axt" x="375" y="562" text-anchor="middle">band-limited Pearson, 0.1&#8211;0.6 Hz (higher is better)</text>

  <!-- better region hint -->
  <text class="hint" x="652" y="508" text-anchor="end">better</text>

  <!-- task dots: x = band-limited Pearson, y = rate MAE, fill = oracle amp rel. err -->
  <circle class="dot" cx="266" cy="174" r="7" fill="#f6ca85"/>
  <circle class="dot" cx="326" cy="218" r="7" fill="#ecb078"/>
  <circle class="dot" cx="618" cy="444" r="7" fill="#3973a9"/>
  <circle class="dot" cx="222" cy="169" r="7" fill="#ca574b"/>
  <circle class="dot" cx="378" cy="237" r="7" fill="#fade90"/>
  <circle class="dot" cx="286" cy="107" r="7" fill="#e6a170"/>
  <circle class="dot" cx="223" cy="176" r="7" fill="#c64b45"/>
  <circle class="dot" cx="362" cy="169" r="7" fill="#e3d193"/>
  <circle class="dot" cx="305" cy="117" r="7" fill="#dd8a65"/>
  <circle class="dot" cx="157" cy="213" r="7" fill="#de8c65"/>

  <!-- task labels -->
  <g class="dlab">
    <text x="278" y="170">T1</text>
    <text x="338" y="212">T2</text>
    <text x="630" y="449">T3</text>
    <text x="196" y="164" text-anchor="end">T4</text>
    <text x="390" y="232">T5</text>
    <text x="298" y="103">T6</text>
    <text x="240" y="196">T7</text>
    <text x="374" y="163">T8</text>
    <text x="317" y="112">T9</text>
    <text x="133" y="228" text-anchor="end">T10</text>
  </g>

  <!-- colour scale for amplitude rel. error: 42 discrete strips (no gradient support needed) -->
  <g>
    <rect x="686" y="510" width="16" height="10" fill="#2669ab"/>
    <rect x="686" y="500" width="16" height="10" fill="#316faa"/>
    <rect x="686" y="490" width="16" height="10" fill="#3b75a9"/>
    <rect x="686" y="480" width="16" height="10" fill="#467aa7"/>
    <rect x="686" y="470" width="16" height="10" fill="#5080a6"/>
    <rect x="686" y="460" width="16" height="10" fill="#5b86a5"/>
    <rect x="686" y="450" width="16" height="10" fill="#658ca3"/>
    <rect x="686" y="440" width="16" height="10" fill="#7092a2"/>
    <rect x="686" y="430" width="16" height="10" fill="#7a97a1"/>
    <rect x="686" y="420" width="16" height="10" fill="#859d9f"/>
    <rect x="686" y="410" width="16" height="10" fill="#8fa39e"/>
    <rect x="686" y="400" width="16" height="10" fill="#9aa99d"/>
    <rect x="686" y="390" width="16" height="10" fill="#a5af9b"/>
    <rect x="686" y="380" width="16" height="10" fill="#afb49a"/>
    <rect x="686" y="370" width="16" height="10" fill="#baba99"/>
    <rect x="686" y="360" width="16" height="10" fill="#c4c097"/>
    <rect x="686" y="350" width="16" height="10" fill="#cfc696"/>
    <rect x="686" y="340" width="16" height="10" fill="#d9cc95"/>
    <rect x="686" y="330" width="16" height="10" fill="#e4d193"/>
    <rect x="686" y="320" width="16" height="10" fill="#eed792"/>
    <rect x="686" y="310" width="16" height="10" fill="#f9dd91"/>
    <rect x="686" y="300" width="16" height="10" fill="#fcdb8e"/>
    <rect x="686" y="290" width="16" height="10" fill="#f9d289"/>
    <rect x="686" y="280" width="16" height="10" fill="#f5c884"/>
    <rect x="686" y="270" width="16" height="10" fill="#f1bf7f"/>
    <rect x="686" y="260" width="16" height="10" fill="#eeb57a"/>
    <rect x="686" y="250" width="16" height="10" fill="#eaac76"/>
    <rect x="686" y="240" width="16" height="10" fill="#e6a271"/>
    <rect x="686" y="230" width="16" height="10" fill="#e3996c"/>
    <rect x="686" y="220" width="16" height="10" fill="#df8f67"/>
    <rect x="686" y="210" width="16" height="10" fill="#dc8662"/>
    <rect x="686" y="200" width="16" height="10" fill="#d87c5e"/>
    <rect x="686" y="190" width="16" height="10" fill="#d47259"/>
    <rect x="686" y="180" width="16" height="10" fill="#d16954"/>
    <rect x="686" y="170" width="16" height="10" fill="#cd5f4f"/>
    <rect x="686" y="160" width="16" height="10" fill="#ca564a"/>
    <rect x="686" y="150" width="16" height="10" fill="#c64c45"/>
    <rect x="686" y="140" width="16" height="10" fill="#c24341"/>
    <rect x="686" y="130" width="16" height="10" fill="#bf393c"/>
    <rect x="686" y="120" width="16" height="10" fill="#bb3037"/>
    <rect x="686" y="110" width="16" height="10" fill="#b72632"/>
    <rect x="686" y="100" width="16" height="10" fill="#b41d2d"/>
    <rect x="686" y="100" width="16" height="420" fill="none" stroke="#9a9a9a" stroke-width="0.6"/>
  </g>
  <g class="cbt">
    <text x="708" y="464">0.5</text>
    <text x="708" y="344">0.6</text>
    <text x="708" y="224">0.7</text>
  </g>
  <g class="tick">
    <line x1="702" y1="460" x2="708" y2="460"/>
    <line x1="702" y1="340" x2="708" y2="340"/>
    <line x1="702" y1="220" x2="708" y2="220"/>
  </g>

  <!-- footnote -->
  <text class="foot" x="90" y="580">Dot colour uses the per-session oracle affine calibration, so it is descriptive, not deployable. The lower-right corner is the better region.</text>
  <text class="foot" x="90" y="596">T4 and T7 nearly coincide; they hold the two lowest band-limited Pearson values (0.254 and 0.255).</text>
</svg>
