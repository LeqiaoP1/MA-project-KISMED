# Stage 3 -- HPC / FULL-CORPUS: TIR-ROI thermal (visual) -> RESP waveform.
#
# L_time is a POINT-WISE Huber term (``torch.nn.SmoothL1Loss``); `huber_beta`
# is its only knob and is expressed in TARGET-STD units. It is the only term in
# the joint loss that sees POLARITY and SHAPE -- an inverted waveform keeps the
# same amplitude, mean and magnitude spectrum, so anything amplitude-only would
# score it as a perfect reconstruction. The cost is that a constant phase offset
# IS charged rather than forgiven, which is the right trade here: the waveform,
# not just the rate, is the deliverable.
#
# !! PROVENANCE GAP -- READ BEFORE QUOTING ANY NUMBER !!
# The CV record in notes/eval/tir_resp/resp_5fold_cv.md (+0.307 pooled
# band-Pearson, 138 subjects) and the output/finetune/resp_tir_roi_hpc{,_fold*}
# dumps behind it were measured BEFORE this term was finalised, under an
# AMPLITUDE-ONLY L_time (``|std(pred) - std(target)|``). They are NOT this
# config's numbers until the 5-fold sweep is re-run, and any results table must
# name the loss it reports.
#
# Do not resume those dumps either: run_waveform.py auto-resumes the latest
# checkpoint in <output_dir>/checkpoints, so continuing them would silently
# change the objective mid-run (utils/checkpoint.py::check_resume_loss warns
# when huber_beta moves). Pass a fresh --output_dir for the new sweep.
#
# HPC twin of configs/finetune/resp_tir_roi_local.yaml, matched to
# configs/pretrain/stage2_hpc_tir_roi_resp.yaml. The geometry differences from
# the local file are input_size 64 -> 96 plus roi_padding 0.10, which is exactly
# what the Stage-2/Stage-3 ROI contract enforces. 96 with padding 0.10 is ~1:1
# with the ~95 px square crop it produces (112 at that padding would be a 1.18x
# upsample of the same photons).
#
# The SAME raw-tree thermal ROI crop the encoder was pre-trained on is the ONLY
# input (simulated total contact-sensor failure); the whole respiration window is
# regressed at once. NO masking anywhere in this stage.
#
# Run from code/ through the ADR-001 sweep, which passes the RAW tree and the
# PER-FOLD Stage-2 encoder:
#   EXP_ROOT=$WORK_SCRATCH/protocol_v1 sbatch scripts/hpc/submit_sweep.sbatch
#
# !! data_path is deliberately NOT set here. The tir_roi path needs the RAW tree
#    ($RAW_DATA_PATH), NOT data/processed/bp4d_canonical, and YAML cannot expand
#    environment variables. submit_sweep.sh passes --raw_root "$RAW_ROOT".
#
# !! finetune stays '' here as well: the sweep passes --finetune <the Stage-2
#    checkpoint of THIS fold>, and run_waveform.py refuses a checkpoint whose
#    partition_digest differs (ADR-001 D4).
#
# ROI CONTRACT (checked hard by runners/run_waveform.py against the --finetune
# checkpoint's stored args; run_waveform.py ABORTS on a mismatch):
#   roi_landmarks / roi_padding / input_size
# Keep them identical to stage2_hpc_tir_roi_resp.yaml.

target: resp

# ---- data: RAW-tree thermal ROI (the Stage-2 input modality) ----
data_set: tir_roi_resp             # -> build_tir_roi_finetune_dataset (Stage-3 view)
# data_path: NOT SET HERE -- submit_sweep.sh passes
#            --raw_root "$RAW_ROOT" (the RAW tree). See the header note.
roi_padding: 0.10                  # MUST equal the Stage-2 run
crop_rule: square                  # MUST equal the Stage-2 run: the padded box
                                   #   is squared BEFORE the rescale, so ONE
                                   #   scale factor (sx == sy) is applied
max_sway_px: 40                    # MUST equal the Stage-2 run: clips whose
                                   #   landmark centroid travels further than
                                   #   this many source px are not in the corpus
roi_landmarks: ''                  # '' = the historical 12-point nose+mouth set
min_signal_spread: 0.1              # VOLTS: DROP a window whose spread
                                   #   (max-min) is below this -- a pinned /
                                   #   unclipped channel. MUST equal the Stage-2
                                   #   value.
rail_touch_v: 9.900                # VOLTS (magnitude): cleaning knob -- drop a
                                   #   clip whose window contains ANY sample that
                                   #   touched the recorder rail (|x| >= 9.90;
                                   #   the recorder clamps at +/-10 V). MUST
                                   #   equal the Stage-2 value, else Stage 3 is
                                   #   not evaluated on the pre-trained corpus.
# ---- task GROUPS ("distortion levels") -- MUST mirror the Stage-2 config ----
# v2 (2026-10-24); canonical: code/data/task_groups.py::SHIPPED_TASK_GROUPS.
task_groups:
  low: [T2, T3, T5]                # passive viewing + short yes/no answers
  moderate: [T1, T4]               # laughter / facial expression + startle
  high: [T6, T7, T8, T9, T10]      # singing, threat, pain, anger, disgust
task_set: ''                       # '' = all tasks -- SAME as the Stage-2 run.
                                   #   ('low,moderate' must match Stage 2 too.)

# ---- model: shared Stage-2 encoder + time-aligned waveform head ----
model: project_multimae_base
streams: tir                       # the ROI crop alone; the 1-D input is the
                                   #   simulated sensor failure
finetune: ''                       # DELIBERATELY EMPTY for the k-fold sweep: the
                                   #   Stage-2 encoder MUST be the one pretrained
                                   #   WITHOUT this fold's test subjects, i.e.
                                   #   pretrain/stage2_hpc_tir_roi_resp_fold<k>/
                                   #   checkpoints/checkpoint-0149.pth.
                                   #   submit_sweep.sh resolves it
                                   #   PER FOLD from the fold's own stage2 dir and
                                   #   aborts when it cannot, and
                                   #   run_waveform.py's fold contract refuses a
                                   #   checkpoint whose partition_digest differs.
                                   #   A whole-corpus pretrain path would bypass
                                   #   both, so it is not expressible: there is
                                   #   no flag that turns the fold check off.
head_hidden: 0                     # 0 = single Linear -> the Stage-2 heads.resp
                                   #   transfers VERBATIM

# ---- clip geometry -- MUST equal the Stage-2 geometry of `finetune` ----
clip_duration: 8.0
fps: 25.0
tubelet: 2,16,16
temporal_stride: 2
input_size: 96                     # <== the HPC value (local tir_roi ships 64).
                                   #   96/16 -> 6x6 = 36 patches/frame -> 1800
                                   #   video tokens at 50 temporal steps.
seq_len: 0                         # 0 => 800 samples = 8 s at fs 100 Hz
fs: 100
sig_kernel: 16                     # 16/100 == 2*2/25 s -> one signal token ==
                                   #   one video tubelet
physio_norm: zscore                # per-clip z-score, applied by the DATASET
                                   #   (one mean/std from the clip's own
                                   #   samples). 'clip' and 'zscore' are
                                   #   synonyms -- there is no session-relative
                                   #   mode any more, so the label of every
                                   #   clip has zero mean and unit std.

# ---- data split (SUBJECT-disjoint) ----
# ---- ADR-001 roles (train / val / test) ------------------------------------
# Roles come from <exp_root>/fold<k>/partition.json (written once by Stage 2 or
# by runners/run_partition.py); there is deliberately no fold-count and no
# split-policy key: K and 70/10/20 are protocol constants.
# The TEST role is scored by `--eval_role test`, never by the training process.
eval_freq: 5                       # epochs between val evaluations (0 = off)
val_select: fixed_epoch            # the only selection rule until Criterion 5
val_criterion: joint_loss          # the value best_val would minimise
# PARTITION RULE -- MUST equal configs/pretrain/stage2_hpc_tir_roi_resp.yaml.
# seed 42 + 'sex' = shuffle within each sex stratum, then interleave, so a fold
# is a near-representative sample instead of a contiguous block of sorted ids
# (which made fold == sex block: F001..F082, then M001..M058).
split_seed: 42
split_stratify: sex
clip_stride: 2.0                   # window hop in SECONDS. MUST equal the Stage-2
                                   #   value (stage2_hpc_tir_roi_resp.yaml): the
                                   #   windows then ARE the pre-training corpus,
                                   #   so Stage 3 is scored on data the encoder
                                   #   actually saw. run_waveform.py warns when
                                   #   this differs from the checkpoint's args.
                                   #   Was 1.0 until 2026-10-09 (7/8 overlap, 2x
                                   #   the windows, better transient sampling --
                                   #   but it made the fine-tune corpus differ
                                   #   from the pre-train one). NOTE: stride 2.0
                                   #   HALVES the windows/epoch vs 1.0, so an
                                   #   epoch is ~2x shorter and a given --epochs
                                   #   sees ~half the optimiser steps.
max_clips: 0                       # 0 = no per-session cap

# ---- joint spatio-temporal-spectral loss (the MR-STFT term lives in Stage 3) ----
alpha: 1.0                         # L_time WEIGHT. The term is a point-wise
                                   #   Huber -- see the header.
beta: 1.0                          # L_Pearson (phase-locking)
gamma: 1.0                         # L_MR-STFT (multi-resolution)
# L_time is the point-wise Huber term; huber_beta is its only knob.
huber_beta: 1.0                    # SmoothL1 transition point in TARGET-STD
                                   #   units. The target is z-scored per clip, so
                                   #   its std is ~1 and 1.0 ~= 1 std: QUADRATIC
                                   #   inside that band, linear beyond. LOWER it
                                   #   for a heavier (L1-like) charge on large
                                   #   errors.
fft_sizes: '128,256,512'           # >= 1 BREATH PER WINDOW for the 0.1-0.6 Hz
                                   #   band; 512 <= the 800-sample (8 s) waveform,
                                   #   so no window is dropped.
eval_band: '0.1,0.6'               # RESP band widened for metric resolution at
                                   #   fs 100 (an 8 s clip allows 0.125 Hz bins)

# ---- training ----
epochs: 150                        # FIXED-EPOCH budget for the k-fold sweep.
                                   #   Option A: no val split, so this is the ONLY
                                   #   stopping rule (metrics_final.json records
                                   #   selection='fixed_epoch'). Keep it IDENTICAL
                                   #   across all folds: the cosine schedule is
                                   #   REBUILT from --epochs and a resume needs
                                   #   the same value (auto-resumes from
                                   #   <output_dir>/checkpoints).
                                   #   At `clip_stride: 2.0` a fold's train view
                                   #   is ~112/139 of the corpus -> ~265 steps/
                                   #   epoch (batch 16 x 4 ranks) -> ~3.5-4 h
                                   #   train-only on 4 x rtx6000 with the ROI
                                   #   cache: a 5-fold sweep is ~20 h of GPU.
                                   #   NOTE warmup_epochs 5 is 3.3 % of the
                                   #   schedule (it was 10 % of the original
                                   #   50-epoch budget); raise it if the early
                                   #   loss is unstable.
batch_size: 16
update_freq: 1
save_ckpt_freq: 10
# (eval_freq is declared once, above, by the ADR-001 block.)

# ---- optimizer (NOTE: run_waveform.py takes an ABSOLUTE lr -- there is no blr) ----
opt: adamw
lr: 1e-4
min_lr: 1e-6
warmup_epochs: 5
weight_decay: 0.05
clip_grad: 5.0                     # ON: this branch carries the gamma=1.0 MR-STFT
                                   #   term and inherits a checkpoint from a
                                   #   stream that already diverged once

num_workers: 8                     # per rank (== cpus-per-task in the sbatch)
save_preds: true                   # preds.npy/targets.npy/entries.json for the
                                   #   session evaluator

# ---- logging ----
output_dir: output/finetune/resp_tir_roi_hpc   # the sbatch overrides this
log_wandb: false
wandb_project: thesis-project
