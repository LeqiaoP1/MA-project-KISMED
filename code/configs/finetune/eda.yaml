# Stage 3 -- EDA regression branch (docs/ImplementationPlan.md)
#
# NOTE (2026-09): the Stage-2 configs currently pre-train on streams `rgb,bvp`
# only, so there is NO Stage-2 encoder for the EDA target. Either add `eda` to
# `streams` in configs/pretrain/stage2_*.yaml and re-run Stage 2, or treat this
# branch as a from-scratch / Stage-1-init baseline (drop `finetune`).
# The model / clip-geometry keys must mirror the Stage-2 run exactly, see the
# fully updated configs/finetune/bvp.yaml.
# Complete sensor failure: only visual streams (RGB + TIR) drive prediction.
target: eda
seq_len: 0               # 0 => the input clip window (see bvp.yaml)
fs: 100                  # sampling rate (Hz)

# Model: shared Stage-2 encoder + regression head
model: project_multimae_base       # Stage-3 path (see bvp.yaml)
streams: rgb                       # Stage-2 was rgb+bvp -> feed RGB only
use_tir: false
clip_duration: 4.0
fps: 25.0
tubelet: 2,16,16
temporal_stride: 1
sig_kernel: 8
input_size: 224
signal_norm: zscore     # raw BP4D streams are not zero-mean (see bvp.yaml)
finetune: ../output/pretrain/stage2_multimodal/checkpoints/checkpoint-0799.pth

# Data (canonical layout from data/prepare_bp4d.py)
data_set: bp4d+
data_path: ../data/processed/bp4d_canonical

# Joint spatio-temporal-spectral loss weights
alpha: 1.0               # L_time   (L1 amplitude)
beta: 1.0                # L_Pearson (phase-locking)
gamma: 1.0               # L_MR-STFT (multi-resolution)
# EDA is slow (tonic + phasic SCR): use longer STFT windows than BVP/RESP
fft_sizes: '256,512,1024'

# Spectral evaluation band (EDA: mostly < 0.5 Hz)
eval_band: '0.01,0.5'

# Training
epochs: 100
batch_size: 16
update_freq: 1
save_ckpt_freq: 10
eval_freq: 1

# Optimizer
opt: adamw
lr: 1e-4
min_lr: 0.0
warmup_epochs: 5
weight_decay: 0.05
clip_grad: 0.0
# data loading: RGB+TIR clips are JPEG/video decoded per sample; parallelise it
num_workers: 4

# Logging
output_dir: output/finetune/eda
log_wandb: false
wandb_project: thesis-project
