# Stage 3 -- LOCAL, TIR-ROI-only -> RESP waveform reconstruction.
#
# The Stage-3 counterpart of configs/pretrain/stage2_local_tir_roi_resp.yaml:
# the SAME raw-tree thermal ROI crop the encoder was pre-trained on is now the
# ONLY input (simulated total contact-sensor failure), and the whole respiration
# window is regressed at once. NO MASKING anywhere in this stage -- see
# core/waveform_model.MultiModalWaveformRegressor (adapters -> pos_embed ->
# encoder -> spatial mean-pool -> linear head; no mask token, no visible-token
# gather) and scripts/local/waveform_local.sh.
#
# Data path: data/raw/BP4D (the RAW tree), NOT data/processed/bp4d_canonical.
# The ROI crop needs the native-resolution thermal video + the IRFeatures
# landmark track, and the canonical tree has neither (and holds only 11
# sessions). The dataset reuses BP4DPlusTIRRespDataset, so the Stage-2
# exclusion rules apply unchanged: a session without IRFeatures is skipped, and
# a clip whose frame span overlaps an all-(0,0) sentinel line is dropped.
# See data/tir_resp_dataset.TirRoiRespFinetuneDataset.
#
# Run from code/:
#   python -u runners/run_waveform.py -c configs/finetune/resp_tir_roi_local.yaml
#
# Leave-one-subject-out sweep (the honest protocol for 4 subjects -- a fixed
# 0.8 ratio can only ever produce ONE fold, always F004):
#   for S in F001 F002 F003 F004; do
#     python -u runners/run_waveform.py -c configs/finetune/resp_tir_roi_local.yaml \
#       --val_subject $S --output_dir ../output/finetune/resp_tir_roi_loso/$S
#   done
#
# MATCHED-PAIR ARM 2 of 2 (Solution A encoder). This file and
# resp_tir_roi_local_matched.yaml are IDENTICAL except `finetune:` and
# `output_dir:` -- the ONLY difference between the two runs is which
# pre-training produced the encoder:
#   arm 1 (Solution C): resp_tir_roi_local_matched.yaml <- shared-encoder MAE
#   arm 2 (Solution A): resp_tir_roi_crossmae.yaml      <- asymmetric cross-MAE
# Both arms share the spec 4.1/4.2 Stage-3 recipe: head_style transposed_conv,
# head_init none, layer_decay 0.75.
#
# Sibling of configs/finetune/resp_local.yaml (RGB -> RESP): the SAME model,
# loss weights (alpha/beta/gamma), optimizer and 64 px ROI crop size. NOTE
# (corrected 2026-10-02): the geometry is deliberately NOT identical, contrary
# to what this comment previously claimed. The TIR branch is a longer, coarser
# clip because ~4 s is only ONE breath at 15 bpm:
#   clip_duration    8.0 s   (RGB 4.0)
#   temporal_stride  2       (RGB 1)
#   sig_kernel       16      (RGB 8)   -> L = 800 samples (RGB 400)
#   clip_stride      2.0     (RGB 1.0)
# Beyond geometry they also differ in clip_grad (5.0 vs 0.0), the TIR-only ROI
# keys (roi_padding / roi_landmarks / roi_quantile / min_signal_spread), the
# task selection, and fft_sizes (128,256,512 vs 64,128,256 -- the RGB branch is
# capped by its 4 s clip). Do NOT call the two "twins": a settings-level diff
# shows ~20 differing keys. Verify any "identical geometry" claim against the
# files before relying on it.

target: resp

# ---- data: RAW-tree thermal ROI (the Stage-2 input modality) ----
data_set: tir_roi_resp             # -> build_tir_roi_finetune_dataset (Stage-3 view)
data_path: ../data/raw/BP4D        # $RAW_DATA_PATH equivalent; NOT the canonical tree
roi_padding: 0.2                   # per-side ROI margin -- MUST equal the Stage-2 run
roi_landmarks: ''                  # '' = the historical 12-point nose+mouth set;
                                   #   a preset (nose_tip preferred) or a CSV.
                                   #   MUST equal the Stage-2 run.
roi_quantile: 0.0                  # MUST equal the Stage-2 run (0.0 = min/max)
min_signal_spread: 0.01            # VOLTS: degenerate-window guard (a
                                   #   (near-)constant target). MUST equal the
                                   #   Stage-2 value.
rail_touch_v: 9.900                # VOLTS (magnitude): cleaning knob -- drop a
                                   #   clip whose window contains ANY sample that
                                   #   touched the recorder rail (|x| >= 9.90;
                                   #   the recorder clamps at +/-10 V). MUST
                                   #   equal the Stage-2 value, else Stage 3 is
                                   #   not evaluated on the pre-trained corpus.

# ---- task GROUPS ("distortion levels") -- MUST equal the Stage-2 corpus ----
# Named subsets of the BP4D+ task labels (T1..T10); the DEFINITIONS live here,
# not in code. Keep task_set/task_groups IDENTICAL to the Stage-2 config the
# `finetune` checkpoint came from, else Stage 3 evaluates on a different task
# mix than it was pre-trained on (the split below is computed on the SAME
# filtered session set). See code/data/task_groups.py.
task_groups:                       # MUST mirror configs/pretrain/stage2_local_tir_roi_resp.yaml
  low: [T2, T3]                    # settled / low motion
  moderate: [T4, T7, T8, T10]      # mid motion
  high: [T1, T5, T6, T9]           # high motion / speech / pain
task_set: ''                       # '' = all tasks; 'low' or 'low,high'.
                                   #   CLI: --task_set (union with --tasks)
                                   #   2026-09-30: mirrored the Stage-2 mapping
                                   #   above; set task_set to the SAME value the
                                   #   Stage-2 run used (e.g. 'low,moderate').

# ---- model: shared Stage-2 encoder + time-aligned waveform head ----
model: project_multimae_base
streams: tir                       # the ROI crop alone; 1-D input is the simulated failure.
                                   #   `use_tir` is deliberately NOT set here: it only controls
                                   #   the CANONICAL paired dataset's rgb+tir channel stack, and
                                   #   nothing reads it on this path (measured 2026-09-26: forcing
                                   #   --use_tir bit-identical -> same 588/168 clips, same clip
                                   #   tensors, same forward output). For a `bp4d+` config,
                                   #   `streams: tir` with use_tir off is a hard error -- that
                                   #   guard is bypassed here, because this dataset IS the TIR.
finetune: ../output/pretrain/stage2_local_tir_roi_crossmae/checkpoints/checkpoint-0039.pth
head_hidden: 0                     # only used by head_style: linear
head_style: transposed_conv         # spec 4.1: learned 1-D upsampling head
                                   #   (Conv1d + ConvTranspose1d, stride
                                   #   samples_per_token = 16). Replaces the
                                   #   linear per-time-step projection.
head_init: none                    # spec 4.1: DISCARD the pre-training decoder
                                   #   head and start RANDOM. IDENTICAL on both
                                   #   arms so the A vs C comparison is not
                                   #   confounded by a one-sided head transfer.

# ---- clip geometry -- MUST equal the Stage-2 geometry of `finetune` ----
# The Stage-2 run was 8 s / temporal_stride 2 / sig_kernel 16 / input 64 -> the
# checkpoint's positions.tir.pos_embed is [1, 800, 768] and heads.resp.weight is
# (16, 768). A 4 s / stride-1 / sig_kernel-8 config would load 146 tensors with
# NO error while silently leaving the head random and the clip half as long --
# the geometry below is what makes the transfer exact.
clip_duration: 8.0
fps: 25.0
tubelet: 2,16,16
temporal_stride: 2
input_size: 64
seq_len: 0                         # 0 => 800 samples = 8 s at fs 100 Hz
fs: 100
sig_kernel: 16                     # 16/100 == 2*2/25 s -> one signal token == one video tubelet
                                   #   (build_waveform_model ENFORCES samples_per_token == sig_kernel)
signal_norm: zscore                # per clip; mirrors the Stage-2 target_norm: clip

# ---- data split (SUBJECT-disjoint; see the LOSO sweep above) ----
train_ratio: 0.8                   # 4 subjects -> 3 train (F001-F003) / val = F004
split_by: subject
val_subject: ''                    # e.g. F001 = LOSO fold (overrides train_ratio/split_by)
clip_stride: 1.0                   # window hop in SECONDS (overlapping): 7/8 of
                                   #   consecutive windows overlap, so the
                                   #   TRANSIENT breathing dynamics are sampled
                                   #   at 1 s resolution (~2x a 2 s hop, ~4x a
                                   #   4 s hop), 0 = non-overlapping
max_clips: 0                       # 0 = no per-session cap (dev knob)

# ---- joint spatio-temporal-spectral loss (Stage-3-only term, gamma = 1.0) ----
# This is where the MR-STFT / periodicity prior lives: Stage 2 does NOT use it
# (every configs/pretrain/*.yaml is spectral_weight: 0.0 -- decision 2026-09-26).
alpha: 1.0                         # L_time   (StdLoss, not L1 -- see
                                   #   configs/finetune/bp_rgb_roi_local.yaml)
beta: 1.0                          # L_Pearson (phase-locking)
gamma: 1.0                         # L_MR-STFT (multi-resolution)
fft_sizes: '128,256,512'           # >= 1 BREATH PER WINDOW: the 0.1-0.6 Hz band
                                   #   (eval_band below) has periods 1.7-10 s, and
                                   #   1.28/2.56/5.12 s windows give 0.78/0.39/0.20 Hz
                                   #   bins, so the band resolves into 4 bins.
                                   #   CORRECTED 2026-10-02 from 64,128,256: those
                                   #   windows (0.64/1.28 s) are SHORTER than one breath
                                   #   period at every frequency in the band, and at 64
                                   #   and 128 the whole band sat in STFT bin 0, so the
                                   #   term policed waveform SHAPE, never rate.
                                   #   512 <= the 800-sample (8 s) waveform, so no window
                                   #   is dropped. MUST equal the Stage-2 value
                                   #   (configs/pretrain/stage2_local_tir_roi_*.yaml,
                                   #   spectral_fft_sizes: 128,256,512) -- Stage 2 and
                                   #   Stage 3 police the same stream, and spec_resp is
                                   #   NOT comparable across window sets.
eval_band: '0.1,0.6'               # RESP band, WIDENED 2026-10-01 for METRIC
                                   #   RESOLUTION: at fs 100 the largest Welch
                                   #   window an 8 s clip allows is 0.125 Hz, so
                                   #   0.16-0.4 (0.24 Hz wide) can hold at most 2
                                   #   bins and used to report a degenerate
                                   #   dominant_freq_error_hz == 0. 0.1-0.6
                                   #   (0.5 Hz) -> 3 bins. Wider than the
                                   #   physiological band => includes some
                                   #   non-resp energy; a resolution choice.

# ---- training ----
epochs: 40
batch_size: 4
update_freq: 1
save_ckpt_freq: 10
eval_freq: 1

# ---- optimizer ----
opt: adamw
lr: 1e-4
min_lr: 1e-6
warmup_epochs: 2
layer_decay: 0.75                  # spec 4.2: layer-wise LR decay (0.65-0.75).
                                   #   Tokenizer most decayed, head at 1.0;
                                   #   applied as a per-group lr_scale that the
                                   #   step schedule multiplies (engines/finetune.py).
weight_decay: 0.05
clip_grad: 5.0                     # ON, unlike the RGB resp_local twin (0.0): this branch
                                   #   carries the gamma=1.0 MR-STFT term AND inherits a
                                   #   checkpoint trained on a stream that already showed
                                   #   one divergence; clipping is the cheap insurance

num_workers: 4
save_preds: true                   # preds.npy/targets.npy/entries.json for the session evaluator

# ---- logging ----
output_dir: ../output/finetune/resp_tir_roi_crossmae
log_wandb: false
wandb_project: thesis-project
