# Stage 2 -- HPC / FULL-CORPUS TRI-MODAL run: TIR-ROI + 2D-TEXTURE ROI -> RESP.
#
# One-variable clone of configs/pretrain/stage2_hpc_tir_roi_resp.yaml: the SAME
# corpus, geometry, optimiser and schedule; the only changes are the third input
# stream (`rgb2d`), the data_set that serves it, its masking ratio and its three
# selection gates. A/B against the TIR-only run is therefore a fair comparison.
#
# Contract: code/notes/design/2DTexture_ROI_cache_preprocessing.md (v2)
# Build order: code/notes/plan/2DTexture_ROI_cache_implementation_plan.md
#
# CACHES ARE PASSED BY THE JOB, NOT HERE. As with the TIR configs, the cache
# roots come from the environment / the sbatch (`--roi_cache`, `--resp_cache`,
# `--rgb2d_cache`), because a YAML key would override the env default with a
# literal and silently disable it. Build the 2D cache FIRST:
#     sbatch scripts/hpc/submit_2d_roi_cache.sbatch
#     python -u runners/run_build_2d_roi_cache.py --check 5 \
#         --out_root "$WORK_SCRATCH/rgb2d_roi_cache"
#
# GEOMETRY IS A CONTRACT, and BOTH VISUAL STREAMS MUST SHARE ONE PATCH GRID:
# input_size / clip_duration / temporal_stride / sig_kernel / tubelet / fps are
# identical to the TIR-only twin. `input_size: 96` -> 6x6 = 36 patches/frame for
# `tir` AND `rgb2d`; MultiModalMAE asserts the alignment, so a mismatch aborts.
# The 2D cache stores NATIVE pixels and resamples once at load, so it is NOT
# tied to 96 -- but this RUN is, and so is the checkpoint.

# ---------------------------------------------------------------- data source
data_set: tir_roi_resp_rgb2d       # TIR-ROI + 2D-texture ROI + Resp_Volts.txt
subjects: ''                       # '' = every discoverable subject
# ---- ADR-001 roles (train / val / test) -- MUST mirror the Stage-3 sibling ---
# TRAIN + VAL come from <exp_root>/fold<k>/partition.json; TEST is never loaded.
split_seed: 42                     # partition seed; identical in both stages
split_stratify: sex                # shuffle within stratum, then interleave
# Pinned validation masking (I6) = 1 - mask_ratio_<stream> of this config.
eval_freq: 5
val_select: fixed_epoch
val_criterion: joint_loss
val_kept_tir: 0.10
val_kept_rgb2d: 0.50
val_kept_resp: 0.50
tasks: ''                          # '' = all tasks; UNIONED with task_set below
# ---- task GROUPS ("distortion levels") -- IDENTICAL to the TIR twin ---------
task_groups:
  low: [T2, T3, T5]                # passive viewing + short yes/no answers
  moderate: [T1, T4]               # laughter / facial expression + startle
  high: [T6, T7, T8, T9, T10]      # singing, threat, pain, anger, disgust
task_set: ''                       # '' = all tasks (FULL corpus)

# ------------------------------------------------------- model / initialisation
model: project_multimae_base       # 768-d / 12-layer -- MUST match pretrained_encoder
pretrained_encoder: videomae:k400  # pre-fetch ONCE on a login node
                                   #   (scripts/hpc/download_weights.sh); compute
                                   #   nodes have no internet.

# ---- streams & tokenizer geometry (MUST match the TIR twin) ----
streams: tir,rgb2d,resp
tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0                          # respiration resampled 1000 -> 100 Hz
fps: 25.0
clip_duration: 8.0                 # 200 source frames -> 100 after decimation
clip_stride: 2.0                   # window hop (s); NOT part of the ROI contract
temporal_stride: 2                 # clipless decimation INSIDE the window
seq_len: 0                         # 0 => round(kept_seconds * fs) = 800 samples
input_size: 96                     # SHARED by tir and rgb2d (one patch grid)
roi_padding: 0.10                  # frozen CACHE KEY (both caches)
crop_rule: square                  # frozen CACHE KEY; one isotropic rescale (I6)
max_sway_px: 40                    # TIR motion gate (source px; 0 = off)
roi_landmarks: ''                  # '' = the TIR 12-point nose+mouth set

# ---- 2D-TEXTURE (rgb2d) SELECTION GATES -- load-time, NEVER cache-key fields --
# Changing any of these costs NO rebuild; they are counted per rule in the run
# log (clips_dropped_2d_*) so the corpus this run saw is auditable afterwards.
rgb2d_landmarks: face              # all 49 points. MUST match the cache build
                                   #   (this one IS a key field).
rgb2d_store: 112                   # the 2D cache is stored RESIZED to 112 px at
                                   #   BUILD time (7.5 MB/clip) instead of native
                                   #   (316 MB/clip). MEASURED 2026-11-12: the
                                   #   native store read 4.9 TB per fold-0 epoch
                                   #   and made this run I/O-bound at 22.6 s/it
                                   #   (~225 h for 150 epochs); 112 px is ~42x
                                   #   less I/O. KEY field: requires a cache
                                   #   built with CACHE_STORE=112 and
                                   #   input_size <= 112 (this run is 96).
rgb2d_cache_lru: 8                 # OPEN shard handles per worker (2 fds each);
                                   #   memory-mapped, so this is not a RAM knob
rgb2d_min_valid_ratio: 1.0         # zero tolerance: a window must have a finite
                                   #   49-point track in EVERY frame (design §4.3)
rgb2d_area_min_frac: 0.5           # drop a CLIP whose own box is <50 % in-frame;
                                   #   black padding must never feed a
                                   #   mostly-empty clip to the model (design §7)
rgb2d_max_sway_px: 110             # MATCHED to the TIR gate (max_sway_px: 40)
                                   #   by code/notes/eval/rgb2d/tir_rgb2d_sway_
                                   #   ratio.py, which pairs both landmark
                                   #   tracks on the same 1375 sessions / 7005
                                   #   windows: RGB reports 3.2x the TIR
                                   #   excursion for the same head motion, and
                                   #   110 px rejects the same fraction of clips
                                   #   that 40 px rejects on TIR (91.9 % kept).
                                   #   Pure scale matching gives 128 px. Library
                                   #   default is 0 = gate off; 220 px would
                                   #   instead optimise for >=90 % of sessions
                                   #   keeping every clip (see sway_retention.md).

# ---- 1-D label validity (IDENTICAL to the TIR twin) ----
min_signal_spread: 0.1             # VOLTS: dead-signal guard (see the TIR twin)
rail_touch_v: 9.900                # VOLTS: recorder-rail guard

# ---- masking ----
mask_ratio_tir: 0.90               # the thermal ROI is the primary visual
mask_ratio_rgb2d: 0.50             # the 2D texture carries the colour/rPPG cue;
                                   #   masking it as hard as the thermal stream
                                   #   would leave ~3.6 of 36 patches visible
mask_ratio_resp: 0.50              # a physio stream's only gradient path is its
                                   #   VISIBLE tokens
mask_ratio_rgb: 0.90               # unused while streams=tir,rgb2d,resp
mask_ratio_bp: 0.50                # unused
# ---- 1-D masking PATTERN (see code/notes/design/SpanMask_PhysioSignals.md) ----
physio_mask: random
mask_span_s: {resp: 4.0}

# ---- loss: per-modality masked MSE (masked positions only) ----
signal_weight: 0.5
# THE label normalisation (the ONLY one in the pipeline): the DATASET z-scores
# each respiration target with its OWN mean/std; the model never touches it
# (run_pretrain.py pins target_norm='none' for every ROI lineage).
physio_norm: zscore

# ---- space-time alignment (checked hard by the model) ----
sig_kernel: 16                     # 16/100 == 2*2/25 s -> one signal token ==
                                   #   one video tubelet
pos_init: sincos3d

# ---- training (full corpus: derive the LR from blr, do NOT set an absolute lr) ----
epochs: 150
batch_size: 16                     # per GPU; lr = blr * batch * world / 256
save_ckpt_freq: 10
opt: adamw
blr: 1.5e-4
min_lr: 0.0
warmup_epochs: 10                  # MUST be < epochs
weight_decay: 0.05
clip_grad: 5.0
num_workers: 8                     # per rank (== cpus-per-task in the sbatch)

# ---- logging ----
output_dir: output/pretrain/stage2_hpc_tir_roi_resp_rgb2d   # sbatch overrides
log_wandb: false
wandb_project: thesis-project
