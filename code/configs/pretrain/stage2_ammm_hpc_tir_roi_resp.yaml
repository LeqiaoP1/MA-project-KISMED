# Stage 2 -- HPC / FULL-CORPUS, AMMM arm A: thermal ROI (visual) -> RESPIRATION.
#
# This is the k-fold / multi-GPU twin of configs/pretrain/stage2_ammm_tir_roi_resp.yaml
# (the 64 px local arm-A config) and the A/B partner of
# configs/pretrain/stage2_hpc_tir_roi_resp.yaml:
# it differs from that ratio twin in EXACTLY ONE variable -- the masking policy
# (`masking: ammm` + the AMMM knobs). Data selection, ROI contract, clip
# geometry, target space, loss and the training schedule are copied verbatim, so
# a paired difference isolates the masking engine.
#
# Design:  code/notes/design/Asymmetric_MultiModal_Masking.md
# Plan:    code/notes/plan/Asymmetric_MultiModal_Masking_plan.md (arm A)
# Sweep:   bash scripts/hpc/submit_ammm_pretrain_kfold.sh            # dry run
#          bash scripts/hpc/submit_ammm_pretrain_kfold.sh --submit   # queue 5 folds
# Pilot:   bash scripts/hpc/submit_ammm_pretrain_kfold.sh --pilot 20 --submit
# Report:  python notes/eval/tir_resp/ammm_pilot_report.py <run_dir_or_log...>
#
# !! input_size 96 + roi_padding 0.10 are chosen TOGETHER and are a FROZEN
#    CONTRACT with configs/finetune/resp_tir_roi_hpc.yaml (ROI_CONTRACT_KEYS).
#    This file is a SEPARATE lineage from the 64 px local pair: do not mix.
#
# Run from code/ (ALWAYS with `-u`, else stdout is block-buffered through tee):
#     python -u runners/run_pretrain.py -c configs/pretrain/stage2_ammm_hpc_tir_roi_resp.yaml \
#         2>&1 | tee ../output/pretrain/stage2_ammm_hpc_tir_roi_resp/train.log

# ---------------------------------------------------------------- data source
data_set: tir_roi                  # raw-tree thermal ROI + Resp_Volts.txt
subjects: ''                       # '' = every discoverable subject
pretrain_split: all                # the sbatch overrides this to `fold` per fold
# ---- k-fold PARTITION (MUST mirror configs/finetune/resp_tir_roi_hpc.yaml) --
# The sbatch passes --n_folds/--fold/--pretrain_split fold; these two knobs
# decide HOW the subjects are GROUPED. Stage 3 must carry the SAME pair, else
# fold k's encoder was pre-trained on fold k's test subjects.
# split_seed null (or split_stratify: none) = the legacy contiguous blocks,
# where fold == sex block. See code/notes/plan/subject_kfold_plan.md.
split_seed: 42                     # seed of the draw; null = legacy blocks
split_stratify: sex                # shuffle within stratum, then interleave
tasks: ''                          # '' = all tasks; UNIONED with task_set below
# ---- task GROUPS ("distortion levels") ----------------------------------
# Definitions live HERE, not in code; pinned by data/task_groups.py and
# tests/test_task_group_configs.py. Kept IDENTICAL to the ratio twin.
task_groups:
  low: [T2, T3, T5]                # passive viewing + short yes/no answers
  moderate: [T1, T4]               # laughter / facial expression + startle
  high: [T6, T7, T8, T9, T10]      # singing, threat, pain, anger, disgust
task_set: ''                       # '' = all tasks (FULL corpus)

# ------------------------------------------------------- model / initialisation
model: project_multimae_base       # 768-d / 12-layer -- MUST match pretrained_encoder
pretrained_encoder: videomae:k400  # Stage-1 corpus; compute nodes are OFFLINE ->
                                   #   pre-fetch once on a login node with
                                   #   scripts/hpc/download_weights.sh

# ---- streams & tokenizer geometry (MUST match the Stage-3 sibling) ----
streams: tir,resp
tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0                          # respiration resampled 1000 -> 100 Hz
fps: 25.0
clip_duration: 8.0                 # 200 source frames -> 100 after decimation
clip_stride: 2.0                   # window hop (s) -- NOT the in-window decimation
temporal_stride: 2                 # 12.5 fps effective; requires sig_kernel 16
seq_len: 0                         # 0 => round(kept_seconds * fs) = 800 samples
input_size: 96                     # 6x6 = 36 spatial patches -> 1800 video
                                   #   tokens at 50 temporal steps
roi_padding: 0.10                  # frozen CACHE KEY -> must equal Stage 3
crop_rule: square
max_sway_px: 40
roi_landmarks: ''                  # the historical 12-point nose+mouth set
min_signal_spread: 0.1             # VOLTS: dead-signal guard
rail_touch_v: 9.900                # VOLTS: drop any rail-touching window
sig_kernel: 16                     # 16/100 == 2*2/25 s -> one token == one tubelet
pos_init: sincos3d

# ---- MASKING: the AMMM engine (THE variable of this arm) -------------------
# Per step, ONE Dirichlet draw over the non-pinned streams decides how much of
# each stream survives; the video stream is kept-capped, the 1-D stream is not.
# The KEPT COUNTS are shared by every sample of the step and may change between
# steps (only the count is shared -- placement stays per-sample random).
#
# Budget on this 96 px geometry (Gt = 50, n_signal = 50):
#   tir : 36 spatial units, cap 0.25 -> <= 9 kept -> <= 450 visible tokens
#   resp: 50 units,         no cap  -> 0..50 kept
# The ratio twin masks 0.90 of tir -> 4 visible patches = 200 tokens, so this
# arm feeds the ENCODER ~2x more video tokens per step (expect a slower step;
# that is what the pilot measures).
masking: ammm
dirichlet_alpha: 1.0               # Dir(1, 1) over {tir, resp} -> uniform-ish
video_kept_cap: 0.25               # <= 25 % of the 6x6 grid -> <= 9 patches kept
physio_kept_cap: 1.0               # no cap (the design's value)
min_kept: 0                        # 0 kept (100 % masked) is a legal draw
modality_dropout: 0.0              # Phase 2 is NOT implemented; 0.0 only
kept_ratio_override: {}            # e.g. {tir: 0.0} pins the visual stream
#
# The legacy mask_ratio_* block below is INERT under masking: ammm. It is kept
# so that flipping `masking: ratio` reproduces the ratio twin EXACTLY.
mask_ratio_tir: 0.90
mask_ratio_resp: 0.50
mask_ratio_rgb: 0.90
mask_ratio_bp: 0.50
mask_ratio_eda: 0.50
physio_mask: random                # span-inside-AMMM is not implemented
mask_span_s: {resp: 4.0}

# ---- loss: per-modality masked MSE (masked positions only) ----
signal_weight: 0.5
# THE label normalisation (the ONLY one in the pipeline): the DATASET z-scores
# each respiration target with its own mean/std; the model is pinned to
# target_norm='none' for tir_roi. 'clip' and 'zscore' are synonyms.
physio_norm: zscore
# NOTE: Stage 2 has no spectral term (the Stage-2 MR-STFT loss was removed
# 2026-11-09). The periodicity loss lives in Stage-3 fine-tuning
# (core/waveform_losses.WaveformJointLoss, gamma), not in this objective.

# ---- training ----------------------------------------------------------
# BUDGET: 300 epochs (the ratio twin stage2_hpc_tir_roi_resp.yaml ships 150).
# Stage 2 has NO validation split and no eval loop, so the loss is a MONITOR,
# not a metric -- and under AMMM its VALUE also moves with the per-step budget
# draw, so it is comparable within this arm only. Judge the run by the Stage-3
# metric; extend by re-submitting with the SAME --output_dir and a LARGER
# --epochs (auto-resume; the LR schedule is rebuilt from --epochs, so raising
# it shifts the schedule).
# !! An equal-compute A/B against the ratio arm needs the SAME --epochs on both
#    sides; 300 vs 150 is not a masking comparison.
epochs: 300
batch_size: 16                     # per GPU; lr = blr * batch * world / 256
save_ckpt_freq: 20                 # 16 ckpts x ~1.2 GB = ~19 GB per fold ->
                                   #   ~95 GB for a 5-fold sweep ($WORK_SCRATCH)
opt: adamw
blr: 1.5e-4                        # -> 3.75e-5 at global batch 64
min_lr: 0.0
warmup_epochs: 10                  # MUST be < epochs (same ~7 % ratio as the twin)
weight_decay: 0.05
clip_grad: 5.0                     # ON: this branch produces resp gradient spikes
num_workers: 8                     # per rank (== cpus-per-task in the sbatch)

# ---- logging ----
output_dir: output/pretrain/stage2_ammm_hpc_tir_roi_resp   # the sbatch overrides
# Rank-0 only, one W&B run per FOLD (the run name is the output-dir basename).
# Compute nodes have NO outbound internet, so submit_pretrain.sbatch defaults
# WANDB_MODE=offline: the run dir collects wandb/offline-run-* and you upload it
# from a LOGIN node with  wandb sync <run_dir>/wandb/offline-run-*
# (or set WANDB_MODE=online in the submitting shell if egress exists).
log_wandb: true
wandb_project: thesis-project
