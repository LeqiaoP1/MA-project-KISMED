# Stage 2 -- LOCAL run WITH Stage-1 encoder inheritance.
# The shared encoder's transformer blocks + the RGB tubelet patch embed are
# initialised from a MAE ViT-Base checkpoint; the TIR/signal adapters, position
# embeddings, cls_token and head stay random (no ImageNet counterpart).
#
# The 'base' spec downloads the checkpoint once into ../models/initial/ (see
# `python runners/run_download_weights.py --list`); a plain path works too.
# Frames per clip match stage2_local.yaml; the input size, batch and clip count
# are kept small so this still fits a LOCAL GPU -- switch to the larger geometry
# (input_size 224, all sessions) on the HPC.
#
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_local_pretrained.yaml

model: project_multimae_base       # 768-d/12-layer -- MUST match pretrained_encoder
pretrained_encoder: base           # or a path: ../models/initial/mae_pretrain_vit_base.pth

# ---- streams & tokenizer geometry (small for a local GPU) ----
# Stage-2 contract: >=1 video (rgb/tir) + >=1 1-D physio (bvp/resp/eda).
# All five = rgb,tir,bvp,resp,eda; ablate by trimming (e.g. rgb,bvp).
streams: rgb,tir,bvp,resp,eda
tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # ~100 frames @ 25 fps -> 50 temporal tubelets
temporal_stride: 1                 # decimate INSIDE the window (1=every frame;
                                   # 2/4/8 -> 12.5/6.25/3.125 fps). NOT the
                                   # window hop (that is clip_stride).
                                   # num_frames = clip_duration*fps/N.
seq_len: 0                         # 0 => clip_duration*fs = 400 signal samples
input_size: 64                     # square; patch size 16x16 => 4x4 spatial grid

# ---- asymmetric masking ----
mask_ratio_rgb: 0.75
mask_ratio_tir: 0.50
# 1-D physio streams are masked hardest (90%+) in Stage 2
mask_ratio_bvp: 0.90
mask_ratio_resp: 0.90
mask_ratio_eda: 0.90

# ---- loss: per-modality masked MSE (masked positions only), then a weighted
# sum. lambda = 1.0 for rgb/tir; lambda = signal_weight for each physio stream
# (see stage2_local.yaml for how to pick it).
signal_weight: 0.5
sig_kernel: 8

# ---- data (canonical layout from data/prepare_bp4d.py) ----
data_path: ../data/processed/bp4d_canonical
max_sessions: 11
max_entries: 32
# Overlapping windows (more samples). For the real HPC run over ALL sessions set
# e.g. clip_stride: 1.0 with clip_duration: 4.0 to reach ~10-20k clips; 0 =
# non-overlapping (stride == clip_duration).

# ---- training (tiny: correctness/overfit only) ----
epochs: 40
batch_size: 2                      # 768-d encoder: keep small on a local GPU
save_ckpt_freq: 10
opt: adamw
# ABSOLUTE peak LR. On the HPC (large batch) drop `lr` and set `blr` instead:
# lr = blr*batch*world/256 would be ~1e-6 at batch 2 and never learn.
lr: 1.0e-3
min_lr: 1.0e-4                     # keep the cosine tail learning
warmup_epochs: 5
weight_decay: 0.05
# data loading: the run is JPEG-decoding bound, so decode frames in parallel
num_workers: 4

# ---- logging ----
output_dir: ../output/pretrain/stage2_local_pretrained
log_wandb: false
