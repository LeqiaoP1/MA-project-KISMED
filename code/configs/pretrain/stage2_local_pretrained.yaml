# Stage 2 -- LOCAL run WITH Stage-1 encoder inheritance.
# This is the INIT A/B twin of configs/pretrain/stage2_local_scratch.yaml: the
# ONLY differences between the two files are the init block below
# (`pretrained_encoder` / `inflate_rgb_patch`) and `output_dir`. Everything else --
# streams, geometry, masking, loss weights, LR schedule, epochs, session/clip
# counts -- is identical on purpose. **If you change a knob here, mirror it in
# the other file.**
# The shared encoder's transformer blocks AND the RGB tubelet patch embed are
# initialised from a **VideoMAE ViT-B** checkpoint (Kinetics-400, tube-masked
# video MAE): its patch embed IS a Conv3d(3, 768, (2,16,16)) tubelet filter, so
# the tokenizer transfers VERBATIM -- the temporal kernel is inherited instead
# of being faked by averaging two frames, and the objective matches Stage 2.
# A plain MAE/ImageNet ViT-B (`mae:base`) also works: it transfers the same 148
# tensors, but its 2-D patch filter is boxcar-inflated (motion-blind at init).
# The TIR/signal adapters, position embeddings, cls_token and head stay random
# (no counterpart in either source).
#
# The 'base' spec resolves to videomae:base and downloads the checkpoint once
# into ../models/initial/ (see `python runners/run_download_weights.py --list`);
# a plain path works too. The input size and batch are kept small (64 px) so this
# still fits a LOCAL GPU; switch to the larger geometry (input_size 224) on the
# HPC. The data block below now uses ALL locally available clips.
#
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_local_pretrained.yaml

model: project_multimae_base       # 768-d/12-layer -- MUST match pretrained_encoder
pretrained_encoder: videomae:base  # 'base' = same; mae:base = plain MAE; or a path
inflate_rgb_patch: 1               # 0 = encoder blocks only, tokenizer random

# ---- streams & tokenizer geometry (small for a local GPU) ----
# Stage-2 contract: >=1 video (rgb/tir) + >=1 1-D physio (bp/resp/eda).
# All five = rgb,tir,bp,resp,eda; ablate by trimming (e.g. rgb,bp).
streams: rgb,bp,resp
#streams: tir, resp

tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # ~100 frames @ 25 fps -> 50 temporal tubelets
temporal_stride: 1                 # decimate INSIDE the window (1=every frame;
                                   # 2/4/8 -> 12.5/6.25/3.125 fps). NOT the
                                   # window hop (that is clip_stride).
                                   # num_frames = clip_duration*fps/N.
seq_len: 0                         # 0 => clip_duration*fs = 400 signal samples
input_size: 64                     # square; patch size 16x16 => 4x4 spatial grid
# ---- space-time alignment (checked hard by the model) ----
# tubelet_t*temporal_stride/fps == sig_kernel/fs -> 2*1/25 == 8/100 == 80 ms,
# and 100/2 == 400/8 == 50 tokens per stream; the model raises otherwise.
# pos_init sincos3d = 3-D (t,h,w) sincos init for the video positions + the
# same 1-D temporal sincos for the physio positions (a Stage-1 MAE pos_embed
# cannot be reused: 197 tokens vs 800 here).
pos_init: sincos3d

# NOTE on 0.90 + a 4x4 grid: a tube mask at 0.90 keeps only 2 of the 16
# spatial patches visible in EVERY frame (VideoMAE's 0.90 is normally used on a
# 14x14 grid at input_size 224). Use 224 for the real run, or drop to 0.75 to
# debug at 64 px.

# ---- asymmetric masking (visual 0.90, waveform 0.50) ----
mask_ratio_rgb: 0.90               # UNCHANGED (VideoMAE-style, aggressive)
mask_ratio_tir: 0.90
# 1-D waveform streams are masked at 0.50, NOT 0.90. A stream's decoder is fed
# `cat([z[:, visible], mask_token...])`, so the VISIBLE physio token count is
# the encoder's only gradient path for that stream: at 0.90 only ~5 of 50 were
# visible (a very thin path -- and with 0 visible the path is exactly zero),
# while 0.50 gives ~25. This is the lever for the measured failure that the
# encoder's pooled rgb features varied only 0.4 % across clips (2.9 % at init)
# and bp/resp reconstruction never beat a constant predictor.
mask_ratio_bp: 0.50
mask_ratio_resp: 0.50
mask_ratio_eda: 0.50               # waveform family (unused while streams=rgb,bp,resp)

# ---- loss: per-modality masked MSE (masked positions only), then a weighted
# sum. lambda = 1.0 for rgb/tir; lambda = signal_weight for each physio stream
# (see stage2_local_scratch.yaml for how to pick it).
signal_weight: 0.5
sig_kernel: 8

# ---- 1-D periodicity prior: multi-resolution STFT magnitude loss -----------
# Mirrors stage2_local_scratch.yaml (the A/B twin): `target_norm: clip` +
# `spectral_weight: 0.1` add an MR-STFT magnitude term on the ASSEMBLED clip
# waveform, so the encoder gets a direct gradient on periodicity that a
# per-token masked MSE cannot express. 0.0 = off. Must stay identical in both
# files, otherwise the Stage-1 init A/B is confounded by a loss change.
target_norm: clip
spectral_weight: 0.0               # RETIRED FROM STAGE 2 (decision 2026-09-26):
                                   # the spectral loss belongs to Stage-3
                                   # finetuning. The A/B run reported earlier
                                   # used 0.1 in BOTH twins, so a re-run with
                                   # this file is not comparable on the
                                   # spect_* columns.
                                   # See TirROI_Resp_plan.md §7.5 + §9;
                                   # keep this line identical to
                                   # stage2_local_scratch.yaml.
spectral_fft_sizes: 64,128,256     # fs=100 Hz -> 1.56 / 0.78 / 0.39 Hz bins
spectral_hop_ratio: 0.25

# ---- data (canonical layout from data/prepare_bp4d.py) ----
data_path: ../data/processed/bp4d_canonical
max_sessions: 11
max_entries: 0                     # 0 = NO cap: use every derived clip. The old
                                   # value 32 sliced entries[:32] AFTER the session
                                   # split, so the training set silently collapsed
                                   # to ONE subject (F001_T1 16 + F001_T2 5 +
                                   # F001_T6 11) out of nine sessions.
clip_stride: 3.0                   # window hop in SECONDS: a 4.0 s window with
                                   # 1.0 s (25 %) overlap. 0 / unset = non-overlapping.
                                   # LOCAL ceiling at a 4 s window by overlap:
                                   # 0 s -> 101 clips / 1 s -> 132 / 2 s -> 196
                                   # / 3 s -> 386. The train split F001-F003 takes
                                   # 84 / 110 / 162 / 320 respectively.
                                   # On the full BP4D set over all sessions,
                                   # clip_stride 1.0 (3 s overlap) reaches ~10-20k.

# ---- training (local run: full local clip budget at 64 px) ----
epochs: 40
batch_size: 2                      # 768-d encoder: keep small on a local GPU
save_ckpt_freq: 10
opt: adamw
# ABSOLUTE peak LR. On the HPC (large batch) drop `lr` and set `blr` instead:
# lr = blr*batch*world/256 would be ~1e-6 at batch 2 and never learn.
lr: 1.0e-3
min_lr: 1.0e-4                     # keep the cosine tail learning
warmup_epochs: 5
weight_decay: 0.05
clip_grad: 0.0                     # 0.0 = OFF (no clipping), which is fine NOW.
                                   # Before the 2026-09-23 fix in
                                   # utils/native_scaler.py this 0.0 zeroed EVERY
                                   # gradient through the AMP path, so the run
                                   # trained nothing (see code/README.md).
# data loading: the run is JPEG-decoding bound, so decode frames in parallel
num_workers: 4

# ---- logging ----
output_dir: ../output/pretrain/stage2_local_pretrained
log_wandb: false
