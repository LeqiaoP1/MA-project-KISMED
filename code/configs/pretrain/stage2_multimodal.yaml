# Stage 2 -- multimodal masked pre-training on BP4D+ (TEMPLATE)
#
# WARNING: this stage requires porting the *multimodal* masked-autoencoding
# model (input/output adapters per stream + masking in the forward pass) from
# tmp/MultiMAE/multimae/ and the BP4D+ dataset (RGB+TIR video, BVP/RESP/EDA).
# Until then `runners/run_pretrain.py` trains a single-stream model only.
# See code/README.md "Suggested port order".

# Streams & asymmetric masking (plan: visual 50-75%, signals 90%+)
streams: rgb,tir,bvp,resp,eda
visual_mask_ratio: 0.75
signal_mask_ratio: 0.95

# Losses: per-modality masked MSE (masked positions only), then a WEIGHTED sum.
# Default policy: lambda_RGB = lambda_TIR = 1.0; every physio (1-D) stream gets
# lambda = signal_weight (typically 0.5-1.0). Pick signal_weight from the
# NORMALIZED VARIANCE of the physio stream's masked target tokens: high var ->
# ~0.5 (avoid 1-D signals dominating the gradient); low var -> ~1.0 (avoid them
# being ignored). loss_weights overrides per stream (ONE float per --streams
# modality in order: rgb,tir,bvp,resp,eda).
signal_weight: 0.5
reconstruct_signals: true

# Model (placeholder -- register your multimodal MAE entrypoint in core/)
model: project_vit_base_patch16_224

# Data
data_set: bp4d+
data_path: /path/to/bp4d+

# Training
epochs: 800
batch_size: 16
update_freq: 1
save_ckpt_freq: 20

# Optimizer
opt: adamw
blr: 1.5e-4
min_lr: 0.0
warmup_epochs: 40
weight_decay: 0.05
clip_grad: 0.0

# Logging
output_dir: output/pretrain/stage2_multimodal
log_wandb: false
wandb_project: thesis-project
