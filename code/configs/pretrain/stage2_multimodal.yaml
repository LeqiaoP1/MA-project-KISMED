# Stage 2 -- multimodal masked pre-training on BP4D+ (HPC / full-data TEMPLATE).
# Copy & adapt; the small local version is configs/pretrain/stage2_local_scratch.yaml.
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_multimodal.yaml

model: project_multimae_base       # 768-d/12-layer -- the NAME sets the geometry
pretrained_encoder: base           # Stage-1 init: 'base' = videomae:base
                                   # (3-D tubelet tokenizer transfers
                                   # verbatim); mae:base = 2-D, inflated;
                                   # '' = from scratch

# ---- streams & tokenizer geometry ----
# Stage-2 contract: >=1 video (rgb/tir) + >=1 1-D physio (bvp/resp/eda).
streams: rgb,bvp

tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # 100 frames @ 25 fps -> 50 temporal tubelets
temporal_stride: 1                 # decimate INSIDE the window (1=every frame;
                                   # 2/4/8 -> 12.5/6.25/3.125 fps). NOT the
                                   # window hop (that is clip_stride).
                                   # num_frames = clip_duration*fps/N.
seq_len: 0                         # 0 => clip_duration * fs = 400 samples
input_size: 224                    # full-frame (no face ROI); 14x14 grid at patch 16
# ---- space-time alignment (checked hard by the model) ----
# tubelet_t*temporal_stride/fps == sig_kernel/fs -> 2*1/25 == 8/100 == 80 ms,
# and num_frames/tubelet_t == seq_len/sig_kernel == 50 tokens per stream; the
# model raises on any other geometry. pos_init sincos3d = 3-D (t,h,w) sincos
# init for the video positions + the same 1-D temporal sincos for the physio
# positions (pos_init: random disables the prior).
pos_init: sincos3d

# ---- asymmetric masking (visual 50-75%, signals 90%+) ----
mask_ratio_rgb: 0.90
mask_ratio_tir: 0.90
mask_ratio_bvp: 0.90
mask_ratio_resp: 0.90
mask_ratio_eda: 0.90

# ---- loss: weighted sum of per-modality masked MSE (see stage2_local_scratch.yaml) ----
signal_weight: 0.5

# ---- 1-D periodicity prior: multi-resolution STFT magnitude loss -----------
# Adds an MR-STFT magnitude term on the ASSEMBLED clip waveform so the encoder
# is pushed to model the cardiac/respiratory cycle, not just token amplitude
# (see stage2_local_scratch.yaml for the full rationale). Requires target_norm:
# clip (one mean/std per clip); 0.0 = off = masked-MSE-only.
target_norm: clip
spectral_weight: 0.1
spectral_fft_sizes: 64,128,256     # fs=100 Hz -> 1.56 / 0.78 / 0.39 Hz bins
spectral_hop_ratio: 0.25

# ---- data ----
data_path: /path/to/bp4d_canonical
clip_stride: 1.0                   # overlapping windows (more clips/session)

# ---- training (large batch: derive the LR from blr, no explicit `lr`) ----
epochs: 800
batch_size: 16
save_ckpt_freq: 20

# ---- optimizer ----
opt: adamw
blr: 1.5e-4
min_lr: 0.0
warmup_epochs: 40
weight_decay: 0.05

# ---- logging ----
output_dir: output/pretrain/stage2_multimodal
log_wandb: false
wandb_project: thesis-project
