# Stage 2 -- multimodal masked pre-training on BP4D+ (HPC / full-data TEMPLATE).
# Copy & adapt; the small local version is configs/pretrain/stage2_local.yaml.
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_multimodal.yaml

model: project_multimae_base       # 768-d/12-layer -- the NAME sets the geometry
pretrained_encoder: videomae:k400  # Stage-1 VideoMAE ViT-B corpus: k400
                                   # (Kinetics-400) or videomae:ssv2
                                   # (Something-Something-v2).

# ---- streams & tokenizer geometry ----
# ADR-002 contract 5: EXACTLY two visual streams (rgb/tir) + one/two 1-D
# physiological streams (bp/resp).
streams: rgb,tir,bp

tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # 100 frames @ 25 fps -> 50 temporal tubelets
temporal_stride: 1                 # decimate INSIDE the window (1=every frame;
                                   # 2/4/8 -> 12.5/6.25/3.125 fps). NOT the
                                   # window hop (that is clip_stride).
                                   # num_frames = clip_duration*fps/N.
seq_len: 0                         # 0 => clip_duration * fs = 400 samples
input_size: 224                    # full-frame (no face ROI); 14x14 grid at patch 16
# ---- space-time alignment (checked hard by the model) ----
# tubelet_t*temporal_stride/fps == sig_kernel/fs -> 2*1/25 == 8/100 == 80 ms,
# and num_frames/tubelet_t == seq_len/sig_kernel == 50 tokens per stream; the
# model raises on any other geometry. pos_init sincos3d = 3-D (t,h,w) sincos
# init for the video positions + the same 1-D temporal sincos for the physio
# positions (pos_init: random disables the prior).
pos_init: sincos3d

# ---- MASKING: ADR-002 constant-budget policy (the whole surface) -----------
# 14x14 = 196 patches, 100 frames / tubelet_t 2 => T = 50 tokens per tube and
# M = 49 tubes. physio_cap_ratio 1.0 is a GEOMETRY ARTEFACT: on this 100 Hz
# grid a 0.5 cap equals half a tubelet, so Mode 2 could never allocate a
# physiological token. The ADR arm (1000 Hz, R = 10) uses 0.5.
n_budget: 350                      # 7 tubes; 2m=4 <= 7 <= 2M=98
video_cap_ratio: 0.25
physio_cap_ratio: 1.0              # see the note above
video_min_tubes: 2
p_virtual_sensing: 0.5
spatial_patches: 196               # tokenizer-derived, asserted at build
physio_tokens: 50                  # tokenizer-derived, asserted at build
physio_placement: scattered

# ---- loss: weighted sum of per-modality masked MSE (see stage2_local_pretrained.yaml) ----
signal_weight: 0.5

# ---- 1-D target normalisation (matches the Stage-3 target space) -----------
# ONE mean/std per (sample, stream), so the token windows reassemble into a
# coherent waveform. NOTE Stage 2 has no spectral term (removed 2026-11-09);
# the MR-STFT loss lives in Stage 3 (WaveformJointLoss gamma).
target_norm: clip

# ---- data ----
data_path: /path/to/bp4d_canonical
clip_stride: 1.0                   # overlapping windows (more clips/session)

# ---- training (large batch: derive the LR from blr, no explicit `lr`) ----
epochs: 800
batch_size: 16
save_ckpt_freq: 20

# ---- optimizer ----
opt: adamw
blr: 1.5e-4
min_lr: 0.0
warmup_epochs: 40
weight_decay: 0.05

# ---- logging ----
output_dir: output/pretrain/stage2_multimodal
log_wandb: false
wandb_project: thesis-project
