# Stage 2 -- FIRST LOCAL overfit/smoke slice (do NOT run on HPC as-is).
# Goal: prove adapters <-> encoder <-> decoder <-> loss wiring end-to-end (the
# masked loss should drop towards ~0 here before any real run).
#
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_local.yaml

model: project_multimae_tiny       # 192-d/6-layer -- the NAME sets the geometry

# ---- streams & tokenizer geometry ----
# Stage-2 contract: >=1 video (rgb/tir) + >=1 1-D physio (bvp/resp/eda).
# All five = rgb,tir,bvp,resp,eda; ablate by trimming (e.g. rgb,bvp).
streams: rgb,tir,bvp,resp,eda
tubelet: 2,16,16                   # (temporal, H, W) tubelet
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # ~100 frames @ 25 fps -> 50 temporal tubelets
seq_len: 0                         # 0 => clip_duration * fs = 400 signal samples
input_size: 64                     # square; patch 16 => 4x4 spatial grid

# ---- asymmetric masking (visual 50-75%, signals 90%+) ----
mask_ratio_rgb: 0.75
mask_ratio_tir: 0.50
# 1-D physio streams are masked hardest (90%+) in Stage 2
mask_ratio_bvp: 0.90
mask_ratio_resp: 0.90
mask_ratio_eda: 0.90

# ---- loss: per-modality masked MSE (masked positions only), then a weighted
# sum. lambda = 1.0 for rgb/tir; lambda = signal_weight for each physio stream.
# Tune it from the NORMALIZED VARIANCE of the physio masked targets: high -> 0.5
# so the 1-D signal does not dominate the gradient, low -> 1.0 so it is not
# ignored (loss_weights overrides per stream, one float per --streams modality).
signal_weight: 0.5

# NOTE: the ViT geometry (embed_dim/depth/heads) comes from `model` above;
# mlp_ratio, dec_depth and sig_kernel keep their defaults. Set any of them here
# only to OVERRIDE, e.g. `enc_embed_dim: 384` for an ablation.

# ---- data (canonical layout from data/prepare_bp4d.py) ----
data_path: ../data/processed/bp4d_canonical
max_sessions: 2
max_entries: 8
# Overlapping windows (more samples). For the real HPC run over ALL sessions set
# e.g. clip_stride: 1.0 with clip_duration: 4.0 to reach ~10-20k clips; 0 =
# non-overlapping (stride == clip_duration).

# ---- training (tiny: correctness/overfit only) ----
epochs: 40
batch_size: 2
save_ckpt_freq: 10
opt: adamw
# ABSOLUTE peak LR. On the HPC (large batch) drop `lr` and set `blr` instead:
# lr = blr*batch*world/256 would be ~1e-6 at batch 2 and never learn.
lr: 1.0e-3
min_lr: 1.0e-4                     # keep the cosine tail learning
warmup_epochs: 5
weight_decay: 0.05
# data loading: the run is JPEG-decoding bound, so decode frames in parallel
num_workers: 4

# ---- logging ----
output_dir: ../output/pretrain/stage2_local
log_wandb: false
