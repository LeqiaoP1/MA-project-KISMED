# Stage 2 -- FIRST LOCAL overfit/smoke slice (do NOT run on HPC as-is).
# Goal: prove adapters <-> encoder <-> decoder <-> loss wiring end-to-end (the
# masked loss should drop towards ~0 here before any real run).
# FROM SCRATCH (no Stage-1 init). The counterpart that DOES inherit the
# VideoMAE encoder is configs/pretrain/stage2_local_pretrained.yaml. The two are
# deliberately NOT the same recipe: this file is the cheapest possible WIRING
# proof (2 streams, 2 sessions, 8 clips), while the pretrained one is a bounded
# run over all local sessions with a second physio stream (3 streams, 11
# sessions, 32 clips) and its own output_dir. To compare the two INITS strictly,
# align streams / max_sessions / max_entries first.
#
# Run from code/:  python runners/run_pretrain.py -c configs/pretrain/stage2_local.yaml

model: project_multimae_base       # 768-d/12-layer/12-head -- the NAME sets it

# ---- streams & tokenizer geometry ----
# Stage-2 contract: >=1 video (rgb/tir) + >=1 1-D physio (bvp/resp/eda).
# All five = rgb,tir,bvp,resp,eda; ablate by trimming (e.g. rgb,bvp).
streams: rgb,bvp

tir_channels: 3                    # thermal is a false-colour render, not gray
tubelet: 2,16,16                   # (temporal, H, W) tubelet
fs: 100.0
fps: 25.0
clip_duration: 4.0                 # ~100 frames @ 25 fps -> 50 temporal tubelets
temporal_stride: 1                 # decimate INSIDE the window (1=every frame;
                                   # 2/4/8 -> 12.5/6.25/3.125 fps). NOT the
                                   # window hop (that is clip_stride).
                                   # num_frames = clip_duration*fps/N.
seq_len: 0                         # 0 => clip_duration * fs = 400 signal samples
input_size: 64                     # square; patch 16 => 4x4 spatial grid
# ---- space-time alignment (checked hard by the model) ----
# One tubelet token and one signal token MUST cover the same time span and
# there must be as many of them: tubelet_t*temporal_stride/fps == sig_kernel/fs
# -> 2*1/25 == 8/100 == 80 ms, and 100/2 == 400/8 == 50 tokens per stream.
# The model raises on any other geometry (it must never "learn" a cross-modal
# relation between tokens that cover different instants). The video positions
# are initialised with a 3-D (t, h, w) sincos grid and the physio positions
# with the SAME 1-D temporal sincos; pos_init: random disables that prior.
pos_init: sincos3d

# NOTE on 0.90 + a 4x4 grid: a tube mask at 0.90 keeps only 2 of the 16
# spatial patches visible in EVERY frame, i.e. 12.5% of the grid carries all
# visual information (VideoMAE's 0.90 is normally used on a 14x14 grid at
# input_size 224). Raise to 224 or drop to 0.75 for the local 64 px debug.

# ---- asymmetric masking (visual 50-75%, signals 90%+) ----
mask_ratio_rgb: 0.90
mask_ratio_tir: 0.90
# 1-D physio streams are masked hardest (90%+) in Stage 2
mask_ratio_bvp: 0.90
mask_ratio_resp: 0.90
mask_ratio_eda: 0.90

# ---- loss: per-modality masked MSE (masked positions only), then a weighted
# sum. lambda = 1.0 for rgb/tir; lambda = signal_weight for each physio stream.
# Tune it from the NORMALIZED VARIANCE of the physio masked targets: high -> 0.5
# so the 1-D signal does not dominate the gradient, low -> 1.0 so it is not
# ignored (loss_weights overrides per stream, one float per --streams modality).
signal_weight: 0.5

# ---- 1-D periodicity prior: multi-resolution STFT magnitude loss -----------
# Adds an MR-STFT magnitude term on the ASSEMBLED clip waveform (see
# stage2_local_scratch.yaml for the full rationale and the target_norm: clip
# requirement). 0.0 = off = masked-MSE-only.
target_norm: clip
spectral_weight: 0.1
spectral_fft_sizes: 64,128,256     # fs=100 Hz -> 1.56 / 0.78 / 0.39 Hz bins
spectral_hop_ratio: 0.25

# NOTE: the ViT geometry (embed_dim/depth/heads) comes from `model` above;
# mlp_ratio, dec_depth and sig_kernel keep their defaults. Set any of them here
# only to OVERRIDE (an ablation).

# ---- data (canonical layout from data/prepare_bp4d.py) ----
data_path: ../data/processed/bp4d_canonical
max_sessions: 2
max_entries: 8
# Overlapping windows (more samples). For the real HPC run over ALL sessions set
# e.g. clip_stride: 1.0 with clip_duration: 4.0 to reach ~10-20k clips; 0 =
# non-overlapping (stride == clip_duration).

# ---- training (local smoke: correctness/overfit only) ----
epochs: 40
batch_size: 2
save_ckpt_freq: 10
opt: adamw
# ABSOLUTE peak LR. On the HPC (large batch) drop `lr` and set `blr` instead:
# lr = blr*batch*world/256 would be ~1e-6 at batch 2 and never learn.
lr: 1.0e-3
min_lr: 1.0e-4                     # keep the cosine tail learning
warmup_epochs: 5
weight_decay: 0.05
# data loading: the run is JPEG-decoding bound, so decode frames in parallel
num_workers: 4

# ---- logging ----
output_dir: ../output/pretrain/stage2_local
log_wandb: false
